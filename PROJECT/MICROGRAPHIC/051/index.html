<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>051 // CORPORATE VOID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #0000AA; overflow: hidden; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #0000AA; color: #fff; display: flex; align-items: center; justify-content: center; font-family: monospace; z-index: 10; font-size: 20px; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">FATAL EXCEPTION 0E</div>
<canvas id="c"></canvas>
<script>
let scene, camera, renderer, grid;
async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    init3D(); initAudio(); animate();
}
function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0000AA); // BSOD Blue
    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    camera.lookAt(0,0,0);
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    
    grid = new THREE.GridHelper(100, 100, 0xffffff, 0xffffff);
    scene.add(grid);

    const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshBasicMaterial({color:0xff0000, wireframe: true}));
    box.position.y = 2;
    scene.add(box);
}
function initAudio() {
    const synth = new Tone.Oscillator(100, "sawtooth").toDestination().start();
    synth.volume.value = -15;
    const lfo = new Tone.LFO(0.5, 50, 150).start().connect(synth.frequency);
}
function animate() {
    requestAnimationFrame(animate);
    grid.rotation.y += 0.005;
    grid.rotation.z = Math.sin(Date.now()*0.001)*0.2;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
