<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>048 // LIMINAL ELEVATOR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #00f; color: #fff; display: flex; align-items: center; justify-content: center; font-family: monospace; z-index: 10; font-size: 24px; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ ENTER SHAFT ]</div>
<canvas id="c"></canvas>
<script>
let scene, camera, renderer, rings = [];
async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    init3D(); initAudio(); animate();
}
function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.05);
    camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 100);
    camera.lookAt(0, -10, 0); // look down
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    const geo = new THREE.BoxGeometry(10, 0.5, 10);
    const edges = new THREE.EdgesGeometry(geo);
    for(let i=0; i<40; i++) {
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x00ffcc}));
        line.position.y = -i * 5;
        scene.add(line);
        rings.push(line);
    }
}
function initAudio() {
    const synth = new Tone.PolySynth(Tone.FMSynth).toDestination();
    synth.volume.value = -10;
    const bit = new Tone.BitCrusher(2).toDestination();
    synth.connect(bit);
    Tone.Transport.bpm.value = 80;
    new Tone.Loop(time => {
        if(Math.random() > 0.2) synth.triggerAttackRelease(["C4","E4","G4","A4"], "8n", time);
    }, "4n").start(0);
    Tone.Transport.start();
}
function animate() {
    requestAnimationFrame(animate);
    rings.forEach(r => {
        r.position.y += 0.2;
        if(r.position.y > 5) r.position.y -= 200;
        r.rotation.y += 0.01;
    });
    renderer.render(scene, camera);
}
</script>
</body>
</html>
