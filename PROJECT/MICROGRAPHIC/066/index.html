<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>066 // THE HEAT DEATH (ТЕПЛОВАЯ СМЕРТЬ)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #333; font-family: "Courier New", monospace; font-size: 14px; cursor: pointer; letter-spacing: 10px;
        }
        #info {
            position: absolute; bottom: 20px; left: 20px; color: #333; font-family: monospace; font-size: 10px; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ ENTROPY INITIATED ]</div>
<div id="info">ENTROPY: <span id="ent">0.0000</span></div>
<canvas id="c"></canvas>

<script>
let cx, W, H;
let particles = [];
let entropy = 0;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    const cv = document.getElementById('c'); cx = cv.getContext('2d');
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    initSystem(); initAudio(); animate();
}

function initSystem() {
    // 10000 particles representing all matter
    for(let i=0; i<10000; i++) {
        particles.push({
            x: W/2 + (Math.random()-0.5)*W*0.1,
            y: H/2 + (Math.random()-0.5)*H*0.1,
            vx: (Math.random()-0.5)*5,
            vy: (Math.random()-0.5)*5,
            mass: Math.random()
        });
    }
}

function initAudio() {
    // Ultra-low rumble of the dying universe
    const rumble = new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 2, sustain: 1, release: 5 } }).toDestination();
    rumble.volume.value = 0;

    // High pitched cold radiation that fades
    const radiation = new Tone.Oscillator(10000, "sine").toDestination().start();
    radiation.volume.value = -30;

    rumble.triggerAttack();

    // Fade everything out over 60 seconds
    rumble.volume.rampTo(-100, 60);
    radiation.frequency.rampTo(100, 60);
    radiation.volume.rampTo(-100, 60);
}

function animate() {
    requestAnimationFrame(animate);
    
    // Slow clear to leave long fading trails
    cx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    cx.fillRect(0,0,W,H);

    entropy += 0.0005; // Time marches forward
    if(entropy > 1) entropy = 1;

    document.getElementById('ent').innerText = entropy.toFixed(4);

    cx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, 0.5 - entropy)})`;

    for(let i=0; i<particles.length; i++) {
        let p = particles[i];
        
        // Particles slow down as entropy increases (cooling)
        let speedMult = Math.max(0.01, 1.0 - entropy);
        p.x += p.vx * speedMult;
        p.y += p.vy * speedMult;
        
        // Expansion
        p.vx += (p.x - W/2) * 0.00001;
        p.vy += (p.y - H/2) * 0.00001;

        cx.fillRect(p.x, p.y, 1, 1);
    }
}
</script>
</body>
</html>
