<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0002 // RHYTHM SYNC</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #010103;
            overflow: hidden;
            font-family: monospace;
        }
        
        canvas { 
            display: block; 
            filter: contrast(1.6) saturate(2.5);
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease;
            color: #ffff00;
            font-size: 14px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ffff00;
        }
        
        .blink {
            animation: blinker 2s linear infinite;
        }
        
        @keyframes blinker { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<div id="overlay" onclick="initAudio()">
    <div class="blink">[ INITIATE RHYTHM LOCK ]</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio and Beat Sync
let audioCtx;
let analyser;
let dataArray;
let beatPulse = 0; // Explicit beat trigger

function initAudio() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 1000);

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    // Synth Drone
    const drone = audioCtx.createOscillator();
    drone.type = 'sawtooth';
    drone.frequency.value = 55;
    const droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.04;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 300;
    
    drone.connect(filter);
    filter.connect(droneGain);
    
    droneGain.connect(analyser);
    
    // Rhythmic Beat
    function playBeat() {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(analyser);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
        
        beatPulse = 1.0; // Trigger visual pulse exactly on beat
        
        setTimeout(playBeat, 400); // 150 BPM
    }

    analyser.connect(audioCtx.destination);
    
    drone.start();
    playBeat();
    
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.5;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 200;
    
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();
}

const numParticles = 1000;
const particles = [];

for (let i = 0; i < numParticles; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        px: 0,
        py: 0,
        vx: 0,
        vy: 0,
        width: Math.random() * 3 + 1,
        // Cyberpunk palette
        hue: Math.random() > 0.6 ? 320 : (Math.random() > 0.3 ? 180 : 60)
    });
}

let tick = 0;

function loop() {
    tick += 1;

    // Decay the beat pulse
    beatPulse *= 0.88;

    let audioIntensity = 0;
    if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
        }
        audioIntensity = sum / dataArray.length;
    }

    // Background reaction to beat
    const bgAlpha = 0.05 - beatPulse * 0.03; // Trails last longer during beat
    ctx.fillStyle = `rgba(1, 1, 3, ${Math.max(0.01, bgAlpha)})`;
    ctx.fillRect(0, 0, width, height);

    // Full screen flash on beat
    if (beatPulse > 0.8) {
        ctx.fillStyle = `rgba(0, 255, 255, 0.05)`;
        ctx.fillRect(0, 0, width, height);
    }

    ctx.globalCompositeOperation = 'lighter';

    const timeX = tick * 0.005;

    for (let i = 0; i < numParticles; i++) {
        let p = particles[i];

        // Physics updates
        for (let step = 0; step < 2; step++) {
            p.px = p.x;
            p.py = p.y;

            const scale = 0.002;
            const angle = Math.sin(p.y * scale + timeX) * Math.PI * 2;

            // Base force + massive spike on beat
            const force = 0.5 + beatPulse * 4.0;
            p.vx += Math.cos(angle) * force;
            p.vy += Math.sin(angle) * (force * 0.5);

            p.vx *= 0.92;
            p.vy *= 0.92;

            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) { p.x = width; p.px = p.x; }
            if (p.x > width) { p.x = 0; p.px = p.x; }
            if (p.y < 0) { p.y = height; p.py = p.y; }
            if (p.y > height) { p.y = 0; p.py = p.y; }

            // Stroke color and width explode on beat
            const brightness = 50 + beatPulse * 30;
            ctx.strokeStyle = `hsl(${p.hue}, 100%, ${brightness}%)`;
            ctx.lineWidth = p.width * (1 + beatPulse * 3);
            
            ctx.beginPath();
            ctx.moveTo(p.px, p.py);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
    }

    ctx.globalCompositeOperation = 'source-over';

    // Rhythm-locked scanlines
    if (beatPulse > 0.5) {
        ctx.fillStyle = `rgba(255, 255, 0, ${beatPulse * 0.3})`;
        for (let i = 0; i < 2; i++) {
            ctx.fillRect(0, Math.random() * height, width, 2 + beatPulse * 5);
        }
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
