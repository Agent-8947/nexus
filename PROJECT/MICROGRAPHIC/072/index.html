<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>072 // KINETIC SWARM (КИНЕТИЧЕСКИЙ РОЙ)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #ff0055; font-family: monospace; font-size: 24px; cursor: pointer;
            letter-spacing: 10px; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ RELEASE SWARM ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;
    #define N 20

    float h(float n) { return fract(sin(n)*43758.5453); }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * r.xy) / r.y;
        float v = 0.0;
        vec3 colSum = vec3(0.0);
        
        // Generate 20 high-speed metaballs
        for(int i = 0; i < N; i++) {
            float fi = float(i);
            
            // Fast, chaotic lissajous paths
            float speed = 3.0 + h(fi) * 5.0;
            vec2 pos = vec2(
                sin(t * speed + h(fi) * 10.0) * 0.8 * cos(t * speed * 0.5 + h(fi + 10.0)),
                cos(t * speed * 1.1 + h(fi + 5.0)) * 0.4 * sin(t * speed * 0.8)
            );
            
            float d = length(uv - pos);
            float field = 0.01 / (d * d + 0.001); // Inverse square law for sticky metaballs
            v += field;
            
            // Cyberpunk color palette
            vec3 c = mix(vec3(1.0, 0.1, 0.5), vec3(0.1, 0.8, 1.0), h(fi * 3.3));
            colSum += c * field;
        }
        
        // Thresholding for hard metaball edges
        float mask = smoothstep(0.9, 1.1, v);
        
        // Color mapping inside the blob
        vec3 finalCol = (colSum / v) * mask;
        
        // Viscous outer glow
        finalCol += (colSum / v) * smoothstep(0.4, 0.9, v) * 0.6;
        
        // Background noise lines (speed lines)
        finalCol += vec3(0.1) * step(0.98, fract(uv.y * 100.0 + t * 10.0)) * (1.0 - mask);

        gl_FragColor = vec4(finalCol, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    window.addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        uniforms.r.value.set(innerWidth, innerHeight);
    });
}

function initAudio() {
    Tone.Transport.bpm.value = 160;

    // Fast, punchy IDM beat
    const kick = new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 5 }).toDestination();
    const hihat = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).toDestination();
    hihat.volume.value = -15;

    // Plucky FM synths for the "swarm" feeling
    const pluck = new Tone.FMSynth({
        harmonicity: 3, modulationIndex: 5,
        oscillator: { type: "triangle" }, modulation: { type: "square" },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
    }).toDestination();
    pluck.volume.value = -10;

    new Tone.Loop(time => {
        kick.triggerAttackRelease("C1", "8n", time);
    }, "4n").start(0);

    new Tone.Loop(time => {
        hihat.triggerAttackRelease("16n", time);
    }, "16n").start(0);

    // Chaotic polyrhythmic melody
    const notes = ["C4", "Eb4", "G4", "Bb4", "C5", "D5"];
    new Tone.Loop(time => {
        if(Math.random() > 0.4) {
            let note = notes[Math.floor(Math.random() * notes.length)];
            pluck.triggerAttackRelease(note, "16n", time);
        }
    }, "16n").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
