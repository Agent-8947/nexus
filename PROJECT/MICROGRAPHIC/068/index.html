<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>068 // EVENT HORIZON (ГОРИЗОНТ СОБЫТИЙ)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #444; font-family: monospace; font-size: 14px; cursor: pointer;
            letter-spacing: 15px;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ SINGULARITY ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * r.xy) / r.y;
        
        float dist = length(uv);
        
        // Event Horizon (Absolute Black)
        float bhRadius = 0.2;
        if(dist < bhRadius) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
        }

        // Gravitational Lensing effect
        vec2 lensedUV = uv * (1.0 - bhRadius / dist);
        
        // Draw a distorted grid / accretion disk
        float grid = sin(lensedUV.x * 50.0 + t) * sin(lensedUV.y * 50.0 - t);
        grid = smoothstep(0.9, 1.0, grid);
        
        // Accretion disk glow
        float glow = 0.01 / (dist - bhRadius);
        
        // Cold, bleak colors
        vec3 col = vec3(grid * 0.1); 
        col += vec3(glow * 0.1, glow * 0.15, glow * 0.2); // Blueish Hawking radiation

        // Fade to black at edges
        col *= smoothstep(1.5, 0.5, dist);

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
}

function initAudio() {
    // Shepard Tone simulation (Endless falling)
    const baseFreq = 50;
    const oscs = [];
    
    for(let i=0; i<6; i++) {
        const osc = new Tone.Oscillator(baseFreq * Math.pow(2, i), "sine").toDestination().start();
        osc.volume.value = -100;
        oscs.push({ osc: osc, oct: i });
    }

    // Crushing sub bass
    const sub = new Tone.Oscillator(30, "sawtooth").toDestination().start();
    const subDist = new Tone.Distortion(0.5).toDestination();
    sub.connect(subDist);
    sub.volume.value = 0;

    let T = 0;
    new Tone.Loop(time => {
        T += 0.1;
        // Shepard tone logic: frequencies descend. Volume is highest in middle octaves.
        oscs.forEach(o => {
            let f = baseFreq * Math.pow(2, o.oct - (T % 1));
            o.osc.frequency.rampTo(f, 0.1);
            
            // Bell curve volume
            let volDist = Math.abs(Math.log2(f / (baseFreq * 8))); // Distance from center
            let vol = -10 - (volDist * 20); // Fade out at extremes
            o.osc.volume.rampTo(Math.max(-100, vol), 0.1);
        });
    }, "16n").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
