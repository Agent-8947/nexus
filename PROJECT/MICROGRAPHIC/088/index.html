<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>088 // ОБЪЯТИЯ ПУСТОТЫ (THE VOID'S EMBRACE)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #ff0055; font-family: monospace; font-size: 24px; cursor: pointer;
            letter-spacing: 15px; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ ПОГРУЗИТЬСЯ ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * r.xy) / r.y;
        vec3 col = vec3(0.0);

        // Spiral/Vortex effect
        float angle = atan(uv.y, uv.x);
        float radius = length(uv);
        
        float spiral = sin(angle * 5.0 + radius * 10.0 - t * 5.0);
        
        // Concentric rings moving inward
        float rings = sin(radius * 20.0 - t * 3.0);
        
        float mask = smoothstep(0.5, 0.0, radius); // Fade out at edges
        
        col += vec3(1.0, 0.0, 0.3) * step(0.9, spiral) * mask;
        col += vec3(0.0, 0.5, 1.0) * step(0.9, rings) * mask;
        
        // Center void
        float center = smoothstep(0.1, 0.15, radius);
        col *= center;

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    window.addEventListener('resize', () => uniforms.r.value.set(innerWidth, innerHeight));
}

function initAudio() {
    Tone.Transport.bpm.value = 80;

    const drone = new Tone.Oscillator(40, "sine").toDestination().start();
    drone.volume.value = -10;

    const noise = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 0.5, decay: 0.5, sustain: 0.5, release: 1 }
    }).toDestination();
    noise.volume.value = -15;

    const autoFilter = new Tone.AutoFilter({ frequency: 0.1, baseFrequency: 200, octaves: 4 }).toDestination().start();
    noise.connect(autoFilter);

    new Tone.Loop(time => {
        noise.triggerAttackRelease("1n", time);
    }, "1m").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
