<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>052 // OPTIC MIGRAINE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #fff; overflow: hidden; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-family: sans-serif; z-index: 10; font-weight: bold; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">WARNING: FLASHING LIGHTS</div>
<canvas id="c"></canvas>
<script id="vs" type="x-shader/x-vertex">void main(){gl_Position=vec4(position,1.0);}</script>
<script id="fs" type="x-shader/x-fragment">
    uniform vec2 r; uniform float t;
    void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*r.xy)/r.y;
        float d = length(uv);
        float c = sin(d*200.0 - t*20.0);
        gl_FragColor = vec4(vec3(step(0.0, c)), 1.0);
    }
</script>
<script>
let renderer, scene, camera, uniforms;
async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}
function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    scene = new THREE.Scene();
    uniforms = { r: {value: new THREE.Vector2(innerWidth, innerHeight)}, t: {value: 0} };
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
        uniforms, vertexShader: document.getElementById('vs').textContent, fragmentShader: document.getElementById('fs').textContent
    })));
}
function initAudio() {
    const osc1 = new Tone.Oscillator(1000, "sine").toDestination().start();
    const osc2 = new Tone.Oscillator(1010, "sine").toDestination().start();
    osc1.volume.value = -20; osc2.volume.value = -20;
}
function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
