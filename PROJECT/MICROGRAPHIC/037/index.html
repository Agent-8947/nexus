<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>037 // ABSURD 3D GLITCH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        canvas { display: block; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; gap: 20px;
        }
        #ot { font-family: monospace; font-size: 16px; color: #fff; letter-spacing: 5px; }
        #os { font-family: monospace; font-size: 10px; color: #444; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">
    <div id="ot">037 // [ENTER_3D_VOID]</div>
    <div id="os">CLICK TO INITIALIZE</div>
</div>
<canvas id="c"></canvas>

<script>
let scene, camera, renderer, mesh;
let T = 0;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    
    init3D();
    initAudio();
    animate();
}

function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.05);
    
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Absurd geometry (Torus Knot with weird parameters)
    const geometry = new THREE.TorusKnotGeometry(1, 0.4, 100, 16, 3, 4);
    const material = new THREE.MeshBasicMaterial({ 
        color: 0x00ff00, 
        wireframe: true,
        transparent: true,
        opacity: 0.8
    });
    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    
    // Add random floating cubes
    const cubeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    for(let i=0; i<50; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const cube = new THREE.Mesh(cubeGeo, mat);
        cube.position.set(
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10
        );
        scene.add(cube);
    }
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function initAudio() {
    // Low frequency rumbling drone
    const lfo = new THREE.Clock();
    const drone = new Tone.Oscillator(40, "sine").toDestination().start();
    drone.volume.value = -20;
    
    const noise = new Tone.Noise("white").toDestination().start();
    noise.volume.value = -35;
    
    // Random bleeps in 3D space (simulated by panning)
    const panner = new Tone.Panner(0).toDestination();
    const synth = new Tone.Synth().connect(panner);
    synth.volume.value = -15;
    
    const loop = new Tone.Loop(time => {
        if (Math.random() > 0.5) {
            panner.pan.value = Math.random() * 2 - 1;
            synth.triggerAttackRelease("C5", "16n", time);
        }
    }, "8n").start(0);
    
    Tone.Transport.start();
}

function animate() {
    requestAnimationFrame(animate);
    T += 0.01;
    
    // Rotate main mesh
    mesh.rotation.x = T;
    mesh.rotation.y = T * 1.5;
    
    // Glitch effect: randomly scale or move vertices/mesh
    if (Math.random() > 0.95) {
        mesh.scale.set(
            1 + (Math.random() - 0.5) * 0.5,
            1 + (Math.random() - 0.5) * 0.5,
            1 + (Math.random() - 0.5) * 0.5
        );
    } else {
        mesh.scale.set(1, 1, 1);
    }
    
    // Camera shake
    if (Math.random() > 0.9) {
        camera.position.x = (Math.random() - 0.5) * 0.2;
        camera.position.y = (Math.random() - 0.5) * 0.2;
    } else {
        camera.position.x = 0;
        camera.position.y = 0;
    }
    
    // Randomly change color
    if (Math.random() > 0.98) {
        mesh.material.color.setHex(Math.random() * 0xffffff);
    }
    
    renderer.render(scene, camera);
}
</script>
</body>
</html>
