<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>046 // TSUNAMI OF VOID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #010101; overflow: hidden; }
        canvas { display: block; filter: contrast(1.2); }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; gap: 20px;
        }
        #ot { font-family: 'Helvetica Neue', sans-serif; font-size: 24px; color: #880000; letter-spacing: 12px; font-weight: bold; text-transform: uppercase; }
        #os { font-family: monospace; font-size: 11px; color: #444; letter-spacing: 4px; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">
    <div id="ot">The Black Wave</div>
    <div id="os">[ BRACE FOR IMPACT ]</div>
</div>
<canvas id="c"></canvas>

<script>
let scene, camera, renderer, waveMesh;
let T = 0;
let waveZ = -200; // Starting far away
let phase = "approaching";

// Audio nodes
let rumble, sirenFilter, siren;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    
    init3D();
    initAudio();
    animate();
}

function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x2b3d4f, 0.015);
    
    // Look slightly up at the looming wave
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 5, 20);
    camera.lookAt(0, 20, 0); 
    
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x2b3d4f);

    // Create the massive wave geometry
    const geoWave = new THREE.PlaneGeometry(300, 150, 150, 80);
    
    const matWave = new THREE.MeshStandardMaterial({ 
        color: 0x115588, // Deep storm blue
        roughness: 0.3,
        metalness: 0.4,
        wireframe: false,
        side: THREE.DoubleSide
    });
    
    waveMesh = new THREE.Mesh(geoWave, matWave);
    waveMesh.position.set(0, -10, waveZ);
    scene.add(waveMesh);

    // Add bright ambient light so everything is visible
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // Add a strong white glow to the crest of the wave
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 100, 50);
    scene.add(dirLight);

    const redLight = new THREE.PointLight(0x00ffff, 8, 300); // Changed to bright cyan
    redLight.position.set(0, 50, 20);
    scene.add(redLight);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function initAudio() {
    // Menacing industrial rumble
    const distortion = new Tone.Distortion(0.8).toDestination();
    const filter = new Tone.Filter(100, "lowpass", -24).connect(distortion);
    
    rumble = new Tone.Noise("brown").connect(filter).start();
    rumble.volume.value = -10;

    // Distant, terrifying siren/drone
    sirenFilter = new Tone.Filter(300, "bandpass", -12).toDestination();
    const reverb = new Tone.Reverb({ decay: 10, wet: 0.8 }).connect(sirenFilter);
    
    siren = new Tone.Oscillator(50, "sawtooth").connect(reverb).start();
    siren.volume.value = -15;

    Tone.Transport.start();
}

function animate() {
    requestAnimationFrame(animate);
    T += 0.02;
    
    // Wave movement logic
    if (phase === "approaching") {
        waveZ += 0.3; // Move towards camera
        
        // Increase audio tension as it gets closer
        const distance = Math.abs(waveZ - camera.position.z);
        if (distance < 150) {
            // Rumble gets louder and brighter
            rumble.volume.value = Tone.gainToDb(Math.min(1.0, 150 / distance));
            siren.frequency.value = 50 + (150 - distance) * 0.5; // Pitch rises
            sirenFilter.frequency.value = 300 + (150 - distance) * 10;
        }

        if (waveZ > 30) {
            // Crash / Reset
            phase = "crashing";
            rumble.volume.value = 10; // Max out
            setTimeout(() => {
                waveZ = -250;
                phase = "approaching";
                rumble.volume.value = -10;
                siren.frequency.value = 50;
            }, 500);
        }
    }

    waveMesh.position.z = waveZ;

    // Deform the plane into a curling tsunami
    const pos = waveMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        let y = pos.getY(i);
        
        // Base coordinate in grid (from 0 to 1 for the height)
        // plane is 150 high, from -75 to 75
        const normalizedY = (y + 75) / 150; 
        
        // Curl the wave forward (Z displacement based on Y height)
        // Higher points curl forward extremely
        const curlDepth = Math.pow(normalizedY, 3) * 80; 
        
        // Surface ripples
        const ripple = Math.sin(x * 0.1 + T * 2) * Math.cos(normalizedY * 10 + T) * 2;
        
        // Set Z to curl towards camera (positive Z), plus ripple
        pos.setZ(i, curlDepth + ripple);
    }
    
    waveMesh.geometry.attributes.position.needsUpdate = true;
    waveMesh.geometry.computeVertexNormals();

    // Camera shake as wave gets very close
    if (waveZ > -20 && waveZ < 30) {
        const shake = (waveZ + 20) * 0.01;
        camera.position.x = (Math.random() - 0.5) * shake;
        camera.position.y = 5 + (Math.random() - 0.5) * shake;
    } else {
        camera.position.x = 0;
        camera.position.y = 5;
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
