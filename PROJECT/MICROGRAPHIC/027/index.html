<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>027 // ALGORITHMIC COMPOSITION</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;background:#020005;overflow:hidden}
canvas{display:block;filter:contrast(1.6) saturate(0.8) brightness(0.8)}
#vig{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 0%,rgba(0,0,0,1) 90%);z-index:15;pointer-events:none}
.bar{position:absolute;left:0;width:100%;height:12%;background:#000;z-index:20;pointer-events:none}
#bt{top:0}#bb{bottom:0}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#020005;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;gap:20px}
#ot{font-family:'Times New Roman',serif;font-size:14px;letter-spacing:14px;color:#a2a;text-transform:uppercase;text-shadow:0 0 15px rgba(150,0,255,0.6)}
#os{font-family:'Times New Roman',serif;font-style:italic;font-size:12px;color:#666;letter-spacing:4px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:0.2}}
#tc{position:absolute;top:13%;right:3%;font-family:monospace;font-size:10px;color:rgba(150,50,255,0.5);z-index:30;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div id="overlay" onclick="begin()">
<div id="ot">027 // ALGORITHMIC COMPOSITION</div>
<div id="os">initiate sequence</div>
</div>
<div id="vig"></div>
<div class="bar" id="bt"></div>
<div class="bar" id="bb"></div>
<div id="tc">00:00:00</div>
<canvas id="c"></canvas>

<script>
let cv,cx,W,H,T=0;
let glitchIntensity=0;
let invert=false;
let st;

async function begin(){
    document.getElementById('overlay').style.display='none';
    
    // Tone.js must be started after a user gesture
    await Tone.start();
    console.log('audio is ready');
    
    cv=document.getElementById('c');cx=cv.getContext('2d');
    resize();window.addEventListener('resize',resize);
    
    initMusic();
    
    st=Date.now();
    setInterval(()=>{if(!st)return;const s=Math.floor((Date.now()-st)/1000);document.getElementById('tc').textContent=`00:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},1000);
    animate();
}

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}

// ── MUSIC ENGINE: TONE.JS ALGORITHMIC MELODY ──
function initMusic() {
    // Synth setup
    const synth = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
    }).toDestination();
    
    const delay = new Tone.FeedbackDelay("8n", 0.5).toDestination();
    synth.connect(delay);

    // Dark Aeolian Scale (A Minor)
    const scale = ["A3", "B3", "C4", "D4", "E4", "F4", "G4", "A4"];
    
    // Random walk or generative melody
    let currentIndex = 0;
    
    const loop = new Tone.Loop(time => {
        // Random walk: step up or down or stay
        const rand = Math.random();
        if(rand < 0.3) currentIndex = Math.max(0, currentIndex - 1);
        else if(rand > 0.7) currentIndex = Math.min(scale.length - 1, currentIndex + 1);
        
        const note = scale[currentIndex];
        
        // Occasionally skip a note for rhythmic interest
        if(Math.random() > 0.2) {
            synth.triggerAttackRelease(note, "8n", time);
            glitchIntensity = 1.0; // Trigger visual glitch on note
        }
    }, "8n").start(0);

    Tone.Transport.bpm.value = 80;
    Tone.Transport.start();
}

// ── VJ ENGINE: ORGANIC GEOMETRY ──
function animate(){
    requestAnimationFrame(animate);
    T+=0.016;
    
    glitchIntensity *= 0.85;
    if(Math.random()>0.98) invert = !invert;
    
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = invert ? 'rgba(220,200,220,0.1)' : 'rgba(5,2,10,0.2)';
    cx.fillRect(0, 0, W, H);
    
    cx.globalCompositeOperation = invert ? 'difference' : 'screen';
    
    const offset = Math.sin(T*10) * 15 * glitchIntensity;
    
    function drawVisuals() {
        cx.beginPath();
        const segments = 100;
        const radius = 100 + Math.sin(T*2)*20 + glitchIntensity*50;
        for(let i=0; i<=segments; i++) {
            const a = (i/segments) * Math.PI * 2;
            const n = Math.sin(i*0.1 + T*5) * 20;
            const r = radius + n;
            const x = W/2 + Math.cos(a)*r;
            const y = H/2 + Math.sin(a)*r;
            
            if(i===0) cx.moveTo(x, y);
            else cx.lineTo(x, y);
        }
        cx.stroke();
    }
    
    cx.save();
    cx.lineWidth = 2;
    
    // RED
    cx.save(); cx.translate(offset, 0); cx.strokeStyle = '#ff0055'; drawVisuals(); cx.restore();
    // GREEN
    cx.save(); cx.translate(-offset, offset); cx.strokeStyle = '#00ff55'; drawVisuals(); cx.restore();
    // BLUE
    cx.save(); cx.translate(0, -offset); cx.strokeStyle = '#aa00ff'; drawVisuals(); cx.restore();
    
    cx.restore();
    cx.globalCompositeOperation = 'source-over';
}
</script>
</body>
</html>
