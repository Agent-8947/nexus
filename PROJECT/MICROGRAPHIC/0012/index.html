<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0012 // ARTHOUSE DEPRESSION (DECAYING MEMORY)</title>
    <script src="https://unpkg.com/hydra-synth"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
        #hydra-canvas { 
            width: 100%; height: 100%; 
            display: block; 
            /* Desaturated, high contrast, degraded film look */
            filter: grayscale(1) contrast(1.8) brightness(0.7);
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            color: #ffffff; font-family: 'Times New Roman', serif; font-size: 10px; letter-spacing: 5px; 
            transition: opacity 8s ease-in;
        }
        
        /* Subliminal arthouse text */
        #subliminal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 18px;
            letter-spacing: 2px;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="initDecay()">
    <div>[ IT NEVER STOPS ]</div>
</div>
<div id="subliminal"></div>
<canvas id="hydra-canvas"></canvas>
<script>
let audioCtx, analyser, masterGain;
const texts = [
    "nothing changes.",
    "the same room.",
    "...",
    "it's getting colder.",
    "waiting.",
    "heavy.",
    "i can't remember.",
    "noise."
];

function initDecay() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 8000);

    initAudio();
    initVisuals();
    startSubliminal();
}

function startSubliminal() {
    const textEl = document.getElementById('subliminal');
    
    function flash() {
        textEl.innerText = texts[Math.floor(Math.random() * texts.length)];
        textEl.style.opacity = '1';
        
        // Very short flash (subliminal)
        setTimeout(() => {
            textEl.style.opacity = '0';
        }, 150 + Math.random() * 800);
        
        // Long agonizing wait between thoughts
        setTimeout(flash, 4000 + Math.random() * 10000);
    }
    setTimeout(flash, 5000);
}

// --- DEPRESSIVE AUDIO ENGINE (TAPE DECAY + LONELY BELL) ---
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;

    // Massive icy reverb
    const convolver = audioCtx.createConvolver();
    // Create a fake impulse response for a huge empty concrete room
    const rate = audioCtx.sampleRate;
    const length = rate * 4.0;
    const impulse = audioCtx.createBuffer(2, length, rate);
    for(let i=0; i<length; i++) {
        const decay = Math.exp(-i / (rate * 1.5));
        impulse.getChannelData(0)[i] = (Math.random() * 2 - 1) * decay;
        impulse.getChannelData(1)[i] = (Math.random() * 2 - 1) * decay;
    }
    convolver.buffer = impulse;

    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 1.0;

    masterGain.connect(convolver);
    convolver.connect(reverbGain);
    reverbGain.connect(analyser);
    masterGain.connect(analyser); // Dry signal
    analyser.connect(audioCtx.destination);

    // 1. Vinyl/Tape Crackle (Dust and decay)
    function playCrackle() {
        if(audioCtx.state === 'closed') return;
        
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 4000;
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.05, audioCtx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain); // Dry, no reverb for crackle
        
        noise.start();
        noise.stop(audioCtx.currentTime + 0.1);
        
        setTimeout(playCrackle, 50 + Math.random() * 800);
    }
    playCrackle();

    // Constant low hiss
    const hissBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    for (let i = 0; i < hissBuffer.length; i++) hissBuffer.getChannelData(0)[i] = Math.random() * 2 - 1;
    const hissNode = audioCtx.createBufferSource();
    hissNode.buffer = hissBuffer;
    hissNode.loop = true;
    const hissFilter = audioCtx.createBiquadFilter();
    hissFilter.type = 'lowpass';
    hissFilter.frequency.value = 8000;
    const hissGain = audioCtx.createGain();
    hissGain.gain.value = 0.01;
    hissNode.connect(hissFilter);
    hissFilter.connect(hissGain);
    hissGain.connect(audioCtx.destination);
    hissNode.start();

    // 2. Suffocating Drone (Very low, out of tune)
    const drone = audioCtx.createOscillator();
    drone.type = 'sine';
    drone.frequency.value = 43.0; // Slightly detuned from F1
    
    // Slight pitch instability (wow/flutter)
    const flutter = audioCtx.createOscillator();
    flutter.type = 'sine';
    flutter.frequency.value = 0.5;
    const flutterGain = audioCtx.createGain();
    flutterGain.gain.value = 0.5;
    flutter.connect(flutterGain);
    flutterGain.connect(drone.frequency);
    flutter.start();

    const droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.8;
    drone.connect(droneGain);
    droneGain.connect(masterGain);
    drone.start();

    // 3. Lonely, dissonant piano/bell note
    const notes = [220.00, 233.08, 261.63]; // A3, Bb3, C4 (Minor, dissonant cluster)
    function playLonelyNote() {
        if(audioCtx.state === 'closed') return;
        
        const freq = notes[Math.floor(Math.random() * notes.length)];
        
        // Create FM synth bell sound
        const carrier = audioCtx.createOscillator();
        carrier.type = 'sine';
        carrier.frequency.value = freq;
        
        const modulator = audioCtx.createOscillator();
        modulator.type = 'triangle';
        modulator.frequency.value = freq * 1.414; // Inharmonic ratio for metallic sad sound
        
        const modGain = audioCtx.createGain();
        modGain.gain.value = freq * 2;
        
        modulator.connect(modGain);
        modGain.connect(carrier.frequency);
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1); // Soft attack
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4.0); // Long lonely decay
        
        carrier.connect(gain);
        gain.connect(masterGain); // Send to massive reverb
        
        modulator.start();
        carrier.start();
        modulator.stop(audioCtx.currentTime + 4.5);
        carrier.stop(audioCtx.currentTime + 4.5);
        
        // Notes play very rarely, emphasizing emptiness
        setTimeout(playLonelyNote, 8000 + Math.random() * 15000);
    }
    playLonelyNote();
}

// --- HARSH VISUAL DECAY (HYDRA) ---
function initVisuals() {
    const hydra = new Hydra({ canvas: document.getElementById("hydra-canvas"), detectAudio: false });

    // Patch: Glacial, tearing monochrome decay
    // Looks like melting film or an empty static screen struggling to form an image
    osc(2, 0.01, 0)
      .thresh(0.8, 0.2) // Harsh black and white threshold
      .diff(src(o0).scale(0.999).scrollY(-0.001)) // Slow downward tear (decaying memory)
      .color(1, 1, 1)
      .modulate(noise(3, 0.05), 0.1) // Erractic noise disruption
      .layer(
          solid()
          .blend(noise(100, 0.1), 0.2) // Constant analog film grain overlay
      )
      .blend(src(o0), 0.95) // Extreme feedback smear, making changes painfully slow
      .out();
}
</script>
</body>
</html>
