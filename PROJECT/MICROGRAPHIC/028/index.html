<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>028 // DEPRESSIVE AMBIENT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;background:#050508;overflow:hidden}
canvas{display:block;filter:contrast(1.8) saturate(0.3) brightness(0.7)}
#vig{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 0%,rgba(0,0,0,1) 85%);z-index:15;pointer-events:none}
.bar{position:absolute;left:0;width:100%;height:15%;background:#000;z-index:20;pointer-events:none}
#bt{top:0}#bb{bottom:0}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#050508;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;gap:20px}
#ot{font-family:'Times New Roman',serif;font-size:14px;letter-spacing:14px;color:#557;text-transform:uppercase;text-shadow:0 0 15px rgba(100,100,150,0.4)}
#os{font-family:'Times New Roman',serif;font-style:italic;font-size:12px;color:#445;letter-spacing:4px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:0.2}}
#tc{position:absolute;top:16%;right:3%;font-family:monospace;font-size:10px;color:rgba(100,100,150,0.3);z-index:30;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div id="overlay" onclick="begin()">
<div id="ot">028 // DEPRESSIVE AMBIENT</div>
<div id="os">enter the void</div>
</div>
<div id="vig"></div>
<div class="bar" id="bt"></div>
<div class="bar" id="bb"></div>
<div id="tc">00:00:00</div>
<canvas id="c"></canvas>

<script>
let cv,cx,W,H,T=0;
let st;

async function begin(){
    document.getElementById('overlay').style.display='none';
    await Tone.start();
    
    cv=document.getElementById('c');cx=cv.getContext('2d');
    resize();window.addEventListener('resize',resize);
    
    initAmbient();
    
    st=Date.now();
    setInterval(()=>{if(!st)return;const s=Math.floor((Date.now()-st)/1000);document.getElementById('tc').textContent=`00:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},1000);
    animate();
}

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}

// ── AUDIO ENGINE: TONE.JS DEPRESSIVE AMBIENT (KEPT) ──
function initAmbient() {
    const reverb = new Tone.Reverb({ decay: 10, wet: 0.8 }).toDestination();
    const lpf = new Tone.Filter(400, "lowpass").connect(reverb);
    
    const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 4, decay: 2, sustain: 0.5, release: 5 }
    }).connect(lpf);
    
    synth.set({ volume: -15 });

    const chords = [
        ["A2", "E3", "A3", "C4"],
        ["F2", "C3", "F3", "A3"],
        ["D2", "A2", "D3", "F3"],
        ["E2", "B2", "E3", "G3"]
    ];
    
    let chordIndex = 0;
    const loop = new Tone.Loop(time => {
        const chord = chords[chordIndex];
        synth.triggerAttackRelease(chord, "7s", time);
        chordIndex = (chordIndex + 1) % chords.length;
    }, "8s").start(0);

    const drone = new Tone.Oscillator(55, "sine").connect(lpf).start();
    const droneGain = new Tone.Gain(0.1).connect(lpf);
    drone.connect(droneGain);

    Tone.Transport.start();
}

// ── VJ ENGINE: ABSTRACT & ABSURD (NEW) ──
function animate(){
    requestAnimationFrame(animate);
    T+=0.016;
    
    // Feedback effect (melt/zoom)
    cx.save();
    cx.globalCompositeOperation = 'source-over';
    // Slightly scale and rotate the previous frame
    cx.translate(W/2, H/2);
    cx.rotate(Math.sin(T*0.1)*0.01);
    cx.scale(1.01, 1.01);
    cx.translate(-W/2, -H/2);
    cx.drawImage(cv, 0, 0);
    cx.restore();
    
    // Fade out slowly
    cx.fillStyle = 'rgba(5,5,8,0.02)';
    cx.fillRect(0, 0, W, H);
    
    cx.globalCompositeOperation = 'difference';
    
    // Absurd random shapes
    if(Math.random() > 0.9) {
        cx.fillStyle = `rgba(${Math.random()*255}, ${Math.random()*50}, ${Math.random()*50}, 0.5)`;
        cx.fillRect(Math.random()*W, Math.random()*H, Math.random()*100, Math.random()*100);
    }
    
    if(Math.random() > 0.95) {
        cx.strokeStyle = '#fff';
        cx.lineWidth = Math.random()*5;
        cx.beginPath();
        cx.moveTo(Math.random()*W, Math.random()*H);
        cx.lineTo(Math.random()*W, Math.random()*H);
        cx.stroke();
    }
    
    // Abstract text / glyphs
    if(Math.random() > 0.97) {
        cx.font = `${20 + Math.random()*50}px monospace`;
        cx.fillStyle = '#fff';
        const texts = ["NULL", "VOID", "ERROR", "∅", "0x0000", "DECAY"];
        cx.fillText(texts[Math.floor(Math.random()*texts.length)], Math.random()*W, Math.random()*H);
    }
    
    // Strange non-euclidean geometry
    cx.strokeStyle = 'rgba(100,100,255,0.1)';
    cx.lineWidth = 1;
    cx.beginPath();
    const radius = 100 + Math.sin(T)*50;
    for(let i=0; i<5; i++) {
        const x = W/2 + Math.cos(T + i)*radius;
        const y = H/2 + Math.sin(T*1.5 + i)*radius;
        if(i===0) cx.moveTo(x, y);
        else cx.lineTo(x, y);
    }
    cx.closePath();
    cx.stroke();
    
    // Extreme contrast pop
    if(Math.random() > 0.99) {
        cx.globalCompositeOperation = 'source-over';
        cx.fillStyle = '#fff';
        cx.fillRect(0, 0, W, H);
    }
}
</script>
</body>
</html>
