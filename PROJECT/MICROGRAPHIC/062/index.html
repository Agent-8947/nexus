<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>062 // ANATHEMA (ИКОНОБОРЧЕСТВО)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: serif; cursor: none; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ WARNING: SEVERE FLASHING ]</div>
<canvas id="c"></canvas>
<script>
let cx, W, H, T=0;
let flash = false;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    const cv = document.getElementById('c'); cx = cv.getContext('2d');
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    initAudio(); animate();
}

function initAudio() {
    Tone.Transport.bpm.value = 180;

    const noise = new Tone.NoiseSynth({ noise: { type: "white" } }).toDestination();
    const dist = new Tone.Distortion(5).toDestination();
    noise.connect(dist);
    noise.volume.value = 5;

    const shriek = new Tone.Oscillator(2000, "sawtooth").connect(dist).start();
    shriek.volume.value = -100;

    new Tone.Loop(time => {
        if(Math.random() > 0.5) {
            noise.triggerAttackRelease("16n", time);
            flash = true;
        }
        
        if(Math.random() > 0.9) {
            shriek.volume.rampTo(0, 0.01);
            shriek.volume.rampTo(-100, 0.5, time + 0.1);
        }
    }, "16n").start(0);

    Tone.Transport.start();
}

function drawCross(x, y, s) {
    cx.fillRect(x - s/2, y - s*1.5, s, s*3);
    cx.fillRect(x - s*1.5, y - s*0.5, s*3, s);
}

function drawInvertedCross(x, y, s) {
    cx.fillRect(x - s/2, y - s*1.5, s, s*4);
    cx.fillRect(x - s*1.5, y + s, s*3, s);
}

function animate() {
    requestAnimationFrame(animate);
    T++;

    if (flash) {
        cx.fillStyle = Math.random() > 0.5 ? '#fff' : '#f00';
        cx.fillRect(0,0,W,H);
        
        cx.fillStyle = '#000';
        if(Math.random() > 0.5) {
            drawInvertedCross(W/2, H/2, Math.random()*200 + 50);
        }

        cx.font = 'bold 20vw serif';
        cx.textAlign = 'center';
        cx.fillText("АНАФЕМА", W/2, H/2 + Math.random()*100 - 50);
        
        flash = false;
    } else {
        cx.fillStyle = 'rgba(0,0,0,0.3)';
        cx.fillRect(0,0,W,H);
        
        // Static noise
        let d = cx.createImageData(W, 10);
        for(let i=0; i<d.data.length; i+=4) {
            let v = Math.random()*255;
            d.data[i]=v; d.data[i+1]=v; d.data[i+2]=v; d.data[i+3]=255;
        }
        cx.putImageData(d, 0, Math.random()*H);
    }
}
</script>
</body>
</html>
