<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>082 // ПЕПЕЛ К ПЕПЛУ (ASHES TO ASHES)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #444; font-family: monospace; font-size: 24px; cursor: pointer;
            letter-spacing: 12px; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ РАССЫПАТЬСЯ ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * r.xy) / r.y;
        vec3 col = vec3(0.0);

        // Disintegrating cross
        float cross_v = smoothstep(0.02, 0.0, abs(uv.x));
        float cross_h = smoothstep(0.02, 0.0, abs(uv.y - 0.1)) * step(abs(uv.x), 0.3);
        
        float m = max(cross_v, cross_h);
        
        // Noise field blowing away
        vec2 p = uv + vec2(t * 0.2, sin(t + uv.x * 5.0) * 0.1);
        float noise = hash(p * 100.0);
        
        if (m > 0.5) {
            if (noise > 0.2 + (uv.x + 0.5) * 0.5) {
                col = vec3(0.8); // Ash particles
            }
        }
        
        // Background static
        col += vec3(hash(uv + t)) * 0.05;
        
        // Vignette
        col *= 1.0 - length(uv) * 0.5;

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    window.addEventListener('resize', () => uniforms.r.value.set(innerWidth, innerHeight));
}

function initAudio() {
    Tone.Transport.bpm.value = 60;

    const noise = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 0.1, decay: 0.5, sustain: 0.5, release: 1 }
    }).toDestination();
    noise.volume.value = -10;

    const synth = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 1, decay: 1, sustain: 1, release: 2 }
    }).toDestination();
    synth.volume.value = -15;

    new Tone.Loop(time => {
        noise.triggerAttackRelease("4n", time);
        synth.triggerAttackRelease("A1", "2n", time);
    }, "1n").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
