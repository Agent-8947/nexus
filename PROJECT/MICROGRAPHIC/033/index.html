<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>033 // QUANTUM FOG</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #020500;
            overflow: hidden;
            font-family: monospace;
        }
        canvas { 
            display: block; 
            filter: contrast(1.2) saturate(1.5) drop-shadow(0 0 15px rgba(0, 255, 100, 0.2));
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 3s ease;
            color: #33ffaa;
            font-size: 14px;
            letter-spacing: 12px;
            text-shadow: 0 0 15px #00ffaa;
            font-style: italic;
        }
        .pulse-text {
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe { 
            0% { opacity: 0.3; transform: scale(0.98); } 
            50% { opacity: 1; transform: scale(1.02); } 
            100% { opacity: 0.3; transform: scale(0.98); } 
        }
    </style>
</head>
<body>

<div id="overlay" onclick="initAudio()">
    <div class="pulse-text">[ BREATHE IN ]</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio Setup - Warm, Deep Green Pad
let audioCtx;
let analyser;
let dataArray;
let heartbeatPulse = 0;

function initAudio() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 3000);

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.9;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    // Warm Pad
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    
    osc1.type = 'sine';
    osc2.type = 'sine';
    
    osc1.frequency.value = 98.00; // G2
    osc2.frequency.value = 98.5; // Slight detune
    
    const padGain = audioCtx.createGain();
    padGain.gain.value = 0.15;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 250;
    
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(padGain);
    
    const breathLfo = audioCtx.createOscillator();
    breathLfo.type = 'sine';
    breathLfo.frequency.value = 0.08; // 12-second breath cycle
    const breathGain = audioCtx.createGain();
    breathGain.gain.value = 0.1;
    
    breathLfo.connect(breathGain);
    breathGain.connect(padGain.gain);
    
    padGain.connect(analyser);
    
    function playHeartbeat() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(45, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
        heartbeatPulse = 1.0;
        setTimeout(playHeartbeat, 3500);
    }

    analyser.connect(audioCtx.destination);
    osc1.start();
    osc2.start();
    breathLfo.start();
    playHeartbeat();
}

// Visuals: Quantum Fog
const numParticles = 600; 
const particles = [];

for (let i = 0; i < numParticles; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 3 + 1,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2,
        phase: Math.random() * Math.PI * 2
    });
}

let tick = 0;

function loop() {
    tick += 1;
    heartbeatPulse *= 0.95;

    let audioIntensity = 0;
    if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 10; i++) sum += dataArray[i];
        audioIntensity = sum / 10;
    }

    const visualBreath = Math.sin(tick * 0.015);

    // Feedback zoom (subtle)
    ctx.save();
    ctx.globalAlpha = 0.96;
    ctx.translate(width / 2, height / 2);
    ctx.scale(0.999 + visualBreath * 0.002, 0.999 + visualBreath * 0.002);
    ctx.translate(-width / 2, -height / 2);
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();

    ctx.fillStyle = `rgba(2, 5, 0, 0.02)`;
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'lighter';

    const baseHue = 120 + Math.sin(tick * 0.003) * 30; // Green to Spring Green

    // Update and draw particles
    for (let p of particles) {
        p.x += p.speedX * (1 + audioIntensity/30);
        p.y += p.speedY * (1 + audioIntensity/30);

        // Brownian motion
        p.x += Math.sin(tick * 0.02 + p.phase) * 0.5;
        p.y += Math.cos(tick * 0.02 + p.phase) * 0.5;

        if(p.x < 0) p.x = width; if(p.x > width) p.x = 0;
        if(p.y < 0) p.y = height; if(p.y > height) p.y = 0;

        const size = p.size + heartbeatPulse * 2;
        const alpha = 0.1 + (Math.sin(tick * 0.01 + p.phase) * 0.5 + 0.5) * 0.3;

        ctx.fillStyle = `hsla(${baseHue}, 80%, 60%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
