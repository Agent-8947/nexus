<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>050 // CURSOR SWARM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #fff; overflow: hidden; cursor: none; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-family: sans-serif; z-index: 10; }
        .cur { position: absolute; font-size: 50px; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">INITIALIZE SWARM</div>
<script>
let cursors = [];
let mx = innerWidth/2, my = innerHeight/2;
async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    for(let i=0; i<100; i++) {
        let d = document.createElement('div');
        d.className = 'cur'; d.innerHTML = '↖';
        document.body.appendChild(d);
        cursors.push({el: d, x: Math.random()*innerWidth, y: Math.random()*innerHeight, vx: 0, vy: 0});
    }
    window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    initAudio(); animate();
}
function initAudio() {
    const osc = new Tone.Oscillator(400, "square").toDestination().start();
    osc.volume.value = -20;
    setInterval(() => {
        osc.frequency.value = Math.random() > 0.5 ? 400 : 4000 * Math.random();
    }, 50);
}
function animate() {
    requestAnimationFrame(animate);
    cursors.forEach(c => {
        c.vx += (mx - c.x) * 0.001 + (Math.random()-0.5)*5;
        c.vy += (my - c.y) * 0.001 + (Math.random()-0.5)*5;
        c.vx *= 0.9; c.vy *= 0.9;
        c.x += c.vx; c.y += c.vy;
        c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
    });
}
</script>
</body>
</html>
