<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICROGRAPHIC // NEXUS VIEWER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-base: #0a0a0a;
            --surface: #141414;
            --border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #666666;
            --accent: #ff3366;
            --sidebar-width: 320px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            margin: 0.5rem 0 0 0;
            letter-spacing: -0.02em;
        }

        .project-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .project-item {
            padding: 0.75rem 1rem;
            background: #1a1a1a;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .project-item:hover {
            background: #222;
            border-color: #333;
        }

        .project-item.active {
            background: #2a2a2a;
            border-color: var(--accent);
        }

        .project-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
        }

        .project-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .project-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .top-bar {
            height: 60px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .current-project-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .current-title {
            font-weight: 600;
        }

        .current-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .fullscreen-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .fullscreen-btn:hover {
            background: #222;
            border-color: #444;
        }

        .fullscreen-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 60px);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Custom Scrollbar for Sidebar */
        .project-list::-webkit-scrollbar {
            width: 6px;
        }
        .project-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .project-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        .project-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>

            <div class="btn-group">

            { id: "088",  name: "Composition Pi-3", desc: "Объятия Пустоты" },
        ];

        const listContainer = document.getElementById('projectList');
        const viewer = document.getElementById('viewer');
        const currentTitle = document.getElementById('currentTitle');
        const currentPath = document.getElementById('currentPath');
        const openBtn = document.getElementById('openBtn');
        const randomBtn = document.getElementById('randomBtn');
        const mixBtn = document.getElementById('mixBtn');

        let currentActive = null;
        let mixInterval = null;

        projects.forEach((p, index) => {
            const item = document.createElement('div');
            item.className = 'project-item';
            item.innerHTML = `
                <div class="project-id">NEXUS-${p.id}</div>
                <div class="project-name">${p.name}</div>
                <div class="project-desc">${p.desc}</div>
            `;
            
            item.addEventListener('click', () => {
                if (currentActive) currentActive.classList.remove('active');
                item.classList.add('active');
                currentActive = item;
                
                loadProject(p);
                
                // Stop auto mix on manual selection
                if (mixInterval) toggleMix();
            });
            
            listContainer.appendChild(item);
        });

        function loadProject(p) {
            const path = `${p.id}/index.html`;
            viewer.src = path;
            currentTitle.textContent = p.name;
            currentPath.textContent = `./${path}`;
            openBtn.onclick = () => window.open(path, '_blank');
        }

        function playRandom() {
            const randomIndex = Math.floor(Math.random() * projects.length);
            const randomProject = projects[randomIndex];
            const items = listContainer.getElementsByClassName('project-item');
            
            if (currentActive) currentActive.classList.remove('active');
            items[randomIndex].classList.add('active');
            currentActive = items[randomIndex];
            
            loadProject(randomProject);
            
            // Scroll into view
            items[randomIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function toggleMix() {
            if (mixInterval) {
                clearInterval(mixInterval);
                mixInterval = null;
                mixBtn.textContent = "AUTO MIX [OFF]";
                mixBtn.classList.remove('active');
            } else {
                playRandom();
                mixInterval = setInterval(playRandom, 30000); // Switch every 30 seconds
                mixBtn.textContent = "AUTO MIX [ON]";
                mixBtn.classList.add('active');
            }
        }

        randomBtn.addEventListener('click', () => {
            playRandom();
            if (mixInterval) toggleMix(); // Stop auto mix if playing manual random
        });
        
        mixBtn.addEventListener('click', toggleMix);

        // Load first project by default
        if (projects.length > 0) {
            const firstItem = listContainer.firstChild;
            firstItem.classList.add('active');
            currentActive = firstItem;
            loadProject(projects[0]);
        }

        // Defensive GSAP animation
        if (typeof gsap !== 'undefined') {
            gsap.from(".sidebar", {
                x: -50,
                opacity: 0,
                duration: 0.8,
                ease: "power3.out"
            });
            gsap.from(".project-item", {
                y: 20,
                opacity: 0,
                duration: 0.5,
                stagger: 0.03,
                ease: "power3.out",
                delay: 0.3
            });
        }
