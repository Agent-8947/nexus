<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICROGRAPHIC // HARMONIC ENTROPY + AUDIO</title>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        
        canvas { display: block; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
            font-size: 18px;
            letter-spacing: 4px;
            color: #ffffff;
            text-align: center;
            line-height: 1.6;
        }
        @keyframes blinker { 50% { opacity: 0; } }
        
        /* ПОЛНОСТЬЮ СКРЫВАЕМ ПЛЕЕР ДЛЯ ФОНОВОГО ЗВУЧАНИЯ */
        #sc-container { 
            position: absolute; 
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0; 
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="overlay" onclick="initSystem()">
    <div class="blink">[ SYSTEM STANDBY ]<br><br>CLICK TO INITIATE</div>
</div>

<div id="sc-container">
    <iframe id="sc-widget" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/jaschahagen/crystal-waters-gypsy-woman&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"></iframe>
</div>

<canvas id="microGrid"></canvas>

<script>
let systemInitiated = false;
let widget;

window.onload = function() {
    const iframeElement = document.getElementById('sc-widget');
    widget = SC.Widget(iframeElement);
};

function initSystem() {
    if(systemInitiated) return;
    systemInitiated = true;
    document.getElementById('overlay').style.display = 'none';
    
    // Запускаем звук через API
    if (widget) {
        widget.setVolume(100);
        widget.play();
    }
}

const canvas = document.getElementById('microGrid');
const ctx = canvas.getContext('2d');
let width, height;
const CELL_SIZE = 340;
let modules = [];
let globalTick = 0;

const charPools = [
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    "@#$%&*+-/\\=<>{}[]()|^~",
    "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ",
    "░▒▓█▄▀■□▣▤▥▦▧▨▩▪▫",
    "ᚠᚡᚢᚣᚤᚥᚦᚧᚨᚩᚪᚫᚬᚭᚮᚯᚰᚱᚲᚳᚴᚵᚶᚷᚸᚹᚺᚻᚼᚽᚾᚿ",
    "ΔΘΛΞΠΣΦΨΩαβγδεζηθικλμνξπρστυφχψω",
    "ℌℍℎℏℐℑℒℓℕ℘ℙℚℛℜℝℤ",
    "⌀⌁⌂⌃⌄⌅⌆⌇⌈⌉⌊⌋⌌⌍⌎⌏⌐⌑⌒⌓⌔⌕⌖⌗⌘⌙",
    "ⴀⴁⴂⴃⴄⴅⴆⴇⴎⴏⴐⴑⴒⴓⴔⴕⴖⴗⴘⴙⴚⴛⴜⴝⴞⴟ"
];
const allChars = charPools.join("");

function randomChars(len) {
    let res = "";
    for(let i=0; i<len; i++) res += allChars[Math.floor(Math.random() * allChars.length)];
    return res;
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    const numModules = 3;
    const spacing = 40;
    const totalWidth = (CELL_SIZE * numModules) + (spacing * (numModules - 1));
    const startX = width / 2 - totalWidth / 2;
    const y = height / 2 - CELL_SIZE / 2;
    if (modules.length === 0) {
        for(let i=0; i<numModules; i++) {
            let mod = new Module(startX + i * (CELL_SIZE + spacing), y, CELL_SIZE, CELL_SIZE);
            mod.tick = i * 5;
            modules.push(mod);
        }
    } else {
        for(let i=0; i<numModules; i++) {
            modules[i].x = startX + i * (CELL_SIZE + spacing);
            modules[i].y = y;
        }
    }
}
window.addEventListener('resize', resize);

class Module {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.type = Math.floor(Math.random() * 15);
        this.seed = Math.random() * 10000;
        this.tick = 0;
        this.scramble = randomChars(20);
    }
    update() {
        this.tick++;
        if (this.tick % 5 === 0) this.scramble = randomChars(20);
        if (this.tick % 15 === 0) {
            this.type = Math.floor(Math.random() * 15);
            this.seed = Math.random() * 10000;
        }
    }
    draw(ctx) {
        const mainColor = '#ffffff';
        const bgColor = '#000000';
        ctx.save();
        ctx.translate(this.x, this.y);
        const s = this.seed;
        ctx.lineWidth = 1 + (s % 3);
        ctx.globalAlpha = 0.5 + ((s % 50) / 100);
        ctx.strokeStyle = mainColor;
        ctx.fillStyle = mainColor;
        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.textBaseline = 'top';
        const padding = 25;
        const drawW = this.w - padding * 2;
        const drawH = this.h - padding * 2;
        ctx.translate(padding, padding);

        ctx.save();
        ctx.fillStyle = `rgba(255,255,255,0.3)`;
        ctx.fillText(this.scramble.substring(0,8), (s*13)%drawW, (s*7)%drawH);
        ctx.fillText(this.scramble.substring(8,16), (s*17)%drawW, (s*19)%drawH);
        ctx.fillText(this.scramble.substring(16,20), (s*23)%drawW, (s*29)%drawH);
        ctx.restore();

        const type = this.type;

        if (type === 0) {
            ctx.fillText(`SEC [${this.scramble.substring(0,6)}] - ACT`, 0, 0);
            ctx.fillText(`L: ${Math.floor(Math.abs(Math.sin(this.tick/40))*100)}% | M: ${randomChars(4)}`, 0, 20);
            ctx.save(); ctx.translate(0, 50);
            const step = (Math.floor(s) % 8) + 2;
            for(let i = 0; i < drawW - 20; i += step)
                if(Math.sin(i*0.1 + this.tick/15 + s) > 0)
                    ctx.fillRect(i, 0, Math.floor(s*i)%5 + 1, 30 + (s%20));
            ctx.restore();
            ctx.fillText(`LOG_${randomChars(6)}.TXT`, 0, 100 + (s%20));

        } else if (type === 1) {
            const cx = drawW/2, cy = drawH/2, r = 40 + (s % 60);
            ctx.save(); ctx.translate(cx, cy);
            ctx.save(); ctx.rotate(this.tick / (20 + (s%40)));
            ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-r-15,0); ctx.lineTo(r+15,0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,-r-15); ctx.lineTo(0,r+15); ctx.stroke();
            ctx.restore();
            ctx.save(); ctx.rotate(-this.tick / (10 + (s%30)));
            ctx.setLineDash([s%15+2, s%20+5]);
            ctx.beginPath(); ctx.arc(0,0,r+15+(s%20),0,Math.PI*2); ctx.stroke();
            ctx.restore(); ctx.restore();
            ctx.fillText(`[AXIS: ${this.scramble.substring(0,4)}]`, cx-50, cy+r+40);

        } else if (type === 2) {
            ctx.fillText(`SYNC: ${this.scramble.substring(0,6)}`, 0, 0);
            const dotSize = (s%5)+2, spc = (s%20)+15;
            const gC = Math.floor((s%8)+4), gR = Math.floor((s%6)+3);
            for(let i=0;i<gC;i++) for(let j=0;j<gR;j++) {
                ctx.beginPath(); ctx.arc(i*spc+20, j*spc+40, dotSize, 0, Math.PI*2);
                Math.sin(i*1.5+j*2.1+this.tick/(10+(s%20))+s) > 0 ? ctx.fill() : ctx.stroke();
            }

        } else if (type === 3) {
            ctx.font = `bold ${30+(s%30)}px "JetBrains Mono"`;
            ctx.fillText(randomChars(3), 0, 0);
            ctx.font = '16px "JetBrains Mono"';
            ctx.fillText(`(${this.scramble.substring(0,6)})`, 0, 60);
            ctx.save(); ctx.translate(drawW-60, 50);
            const nc = Math.floor(s%5)+2;
            for(let i=0;i<nc;i++) {
                const nx = Math.cos(s*i)*(20+(s%40)), ny = Math.sin(s*i)*(20+(s%40));
                ctx.beginPath(); ctx.arc(nx,ny,(s*i)%10+5,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(nx,ny); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(0,0,10+Math.sin(this.tick/15)*5,0,Math.PI*2); ctx.fill();
            ctx.restore();

        } else if (type === 4) {
            ctx.fillText(`✧ ${this.scramble.substring(0,8)} ✧`, 0, 0);
            const freq = 10+(s%40), amp = 10+(s%50);
            ctx.beginPath(); ctx.moveTo(0,70);
            for(let i=0;i<=drawW;i+=2) ctx.lineTo(i, 70+Math.sin(i/freq+this.tick/10)*amp*Math.sin(this.tick/40));
            ctx.stroke();
            ctx.fillRect((this.tick*((s%5)+2))%drawW, 70-amp, 2, amp*2);

        } else if (type === 5) {
            ctx.strokeRect(0,0,drawW,80+(s%60));
            ctx.fillStyle = mainColor; ctx.fillRect(drawW-70,20,50,50);
            ctx.fillStyle = bgColor;
            ctx.beginPath(); ctx.moveTo(drawW-60,30+(s%10)); ctx.lineTo(drawW-20-(s%15),70); ctx.lineTo(drawW-60+(s%20),70-(s%10)); ctx.fill();
            ctx.fillStyle = mainColor;
            ctx.font = 'bold 24px "JetBrains Mono"'; ctx.fillText("DECIPHER",15,20);
            ctx.font = '12px "JetBrains Mono"'; ctx.fillText(randomChars(10),15,60);

        } else if (type === 6) {
            ctx.fillText(`HEX // ${this.scramble.substring(0,5)}`, 0, 0);
            ctx.save(); ctx.translate(drawW/2, drawH/2);
            for(let i=0;i<Math.floor(s%5)+2;i++) {
                ctx.rotate(this.tick/100+i);
                ctx.beginPath();
                for(let j=0;j<6;j++) {
                    const r2 = 20+i*(15+(s%15));
                    const hx = Math.cos(j*Math.PI/3)*r2, hy = Math.sin(j*Math.PI/3)*r2;
                    j===0 ? ctx.moveTo(hx,hy) : ctx.lineTo(hx,hy);
                }
                ctx.closePath(); ctx.stroke();
            }
            ctx.restore();

        } else if (type === 7) {
            ctx.fillText(`ERR: ${this.scramble.substring(0,8)}`, 0, 0);
            for(let i=0;i<Math.floor(s%20)+10;i++)
                if(Math.random()>0.3)
                    ctx.fillRect(Math.random()*(drawW-20), 20+Math.random()*(drawH-40), Math.random()*(20+(s%60)), Math.random()*(5+(s%15)));

        } else if (type === 8) {
            const cx=drawW/2,cy=drawH/2,r1=40+(s%30),r2=r1-(10+(s%10));
            ctx.save(); ctx.translate(cx,cy);
            ctx.beginPath(); ctx.arc(0,0,r1,0,Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0,0,r2,0,Math.PI*1.5*Math.abs(Math.sin(this.tick/(10+(s%20))))); ctx.lineTo(0,0); ctx.fill();
            ctx.fillStyle = bgColor; ctx.beginPath(); ctx.arc(0,0,r2-(5+(s%15)),0,Math.PI*2); ctx.fill();
            ctx.fillStyle = mainColor; ctx.fillText(randomChars(4),-15,-5);
            ctx.restore();

        } else if (type === 9) {
            ctx.fillText(`UPLINK // ${this.scramble.substring(0,6)}`, 0, 0);
            for(let i=0;i<drawW;i+=15+(s%20)) {
                if(Math.sin(i+this.tick/(5+(s%15)))>0.1) {
                    const drop = (this.tick*((s%3)+2)+i*20)%(drawH-40);
                    ctx.fillText(randomChars(1),i,30+drop);
                    ctx.fillRect(i,50+drop,(s%3)+1,(s%15)+5);
                }
            }

        } else if (type === 10) {
            const cx=drawW/2,cy=drawH/2,r=50+(s%40);
            ctx.save(); ctx.translate(cx,cy);
            ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0,0,r/2,0,Math.PI*2); ctx.stroke();
            ctx.rotate(this.tick/20);
            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r,0); ctx.stroke();
            ctx.fillStyle = `rgba(255,255,255,0.2)`;
            ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI/4); ctx.lineTo(0,0); ctx.fill();
            ctx.restore();
            ctx.fillText(`RADAR // ${this.scramble.substring(0,5)}`, 0, 0);

        } else if (type === 11) {
            ctx.fillText(`VOL: ${this.scramble.substring(0,8)}`, 0, 0);
            ctx.save(); ctx.translate(drawW/2, drawH/2);
            const size=30+(s%30), offset=15+Math.sin(this.tick/20)*15;
            ctx.strokeRect(-size,-size,size*2,size*2);
            ctx.strokeRect(-size+offset,-size+offset,size*2,size*2);
            ctx.beginPath();
            ctx.moveTo(-size,-size); ctx.lineTo(-size+offset,-size+offset);
            ctx.moveTo(size,-size); ctx.lineTo(size+offset,-size+offset);
            ctx.moveTo(-size,size); ctx.lineTo(-size+offset,size+offset);
            ctx.moveTo(size,size); ctx.lineTo(size+offset,size+offset);
            ctx.stroke(); ctx.restore();

        } else if (type === 12) {
            ctx.fillText(`POLY_${this.scramble.substring(0,5)}`, 0, 0);
            ctx.save(); ctx.translate(drawW/2, drawH/2);
            const sides = 3+(s%5);
            for(let i=0;i<4;i++) {
                ctx.rotate(this.tick/(40+i*10));
                ctx.beginPath();
                for(let j=0;j<=sides;j++) {
                    const r2=20+i*(15+(s%10)), angle=j*(Math.PI*2/sides);
                    j===0 ? ctx.moveTo(Math.cos(angle)*r2, Math.sin(angle)*r2) : ctx.lineTo(Math.cos(angle)*r2, Math.sin(angle)*r2);
                }
                ctx.stroke();
            }
            ctx.restore();

        } else if (type === 13) {
            ctx.font = '10px "JetBrains Mono"';
            for(let r=0;r<12+(s%8);r++) {
                let line = `0x00${Math.floor(s%9)}${r}: `;
                for(let c=0;c<6;c++) line += randomChars(2)+" ";
                ctx.fillText(line, 0, r*12);
            }

        } else if (type === 14) {
            ctx.fillText(`TARGET_LOCK: ${this.scramble.substring(0,6)}`, 0, 0);
            const cx=drawW/2,cy=drawH/2,r=60+(s%30);
            ctx.save(); ctx.translate(cx,cy);
            ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(-r+20,0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(r-20,0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,-r+20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,r); ctx.lineTo(0,r-20); ctx.stroke();
            ctx.rotate(this.tick/30);
            for(let i=0;i<360;i+=15) { ctx.rotate(15*Math.PI/180); if(i%90!==0) { ctx.beginPath(); ctx.moveTo(r-5,0); ctx.lineTo(r,0); ctx.stroke(); } }
            ctx.restore();
        }

        const cs = 12;
        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        ctx.moveTo(0,cs); ctx.lineTo(0,0); ctx.lineTo(cs,0);
        ctx.moveTo(drawW-cs,0); ctx.lineTo(drawW,0); ctx.lineTo(drawW,cs);
        ctx.moveTo(0,drawH-cs); ctx.lineTo(0,drawH); ctx.lineTo(cs,drawH);
        ctx.moveTo(drawW-cs,drawH); ctx.lineTo(drawW,drawH); ctx.lineTo(drawW,drawH-cs);
        ctx.stroke();
        ctx.restore();
    }
}

function loop() {
    globalTick++;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(0, height/2); ctx.lineTo(width, height/2);
    ctx.stroke();
    if(systemInitiated) {
        for(let mod of modules) { mod.update(); mod.draw(ctx); }
    }
    requestAnimationFrame(loop);
}

resize();
loop();
</script>
</body>
</html>
