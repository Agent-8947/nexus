<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0010 // AMBIENT LOST HIGHWAY</title>
    <!-- Three.js for 3D Environment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-weight: bold;
        }
        #webgl-canvas { 
            width: 100%; height: 100%; 
            display: block; 
            /* Subtle cinematic grade */
            filter: contrast(1.2) brightness(0.9) sepia(0.1) hue-rotate(-10deg);
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            color: #88bbff; font-size: 13px; letter-spacing: 15px; 
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(136, 187, 255, 0.5);
            transition: opacity 4s ease-in;
        }
        .pulse { animation: pulse 4s infinite ease-in-out; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>
<div id="overlay" onclick="initAmbientHighway()">
    <div class="pulse">ENTER THE DRIFT</div>
</div>
<div id="webgl-canvas"></div>
<script>
let audioCtx, analyser;
let scene, camera, renderer;
let roadUniforms;
let audioDataArray;

function initAmbientHighway() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 4000);

    initAudio();
    init3D();
    animate();
}

// --- AMBIENT AUDIO ENGINE (FROM 0008) ---
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.9;
    audioDataArray = new Uint8Array(analyser.frequencyBinCount);

    // Deep Reverb/Delay Network for Ambient Space
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    
    const delay1 = audioCtx.createDelay(5.0);
    delay1.delayTime.value = 0.8;
    const delay1Feedback = audioCtx.createGain();
    delay1Feedback.gain.value = 0.6;
    
    const delay2 = audioCtx.createDelay(5.0);
    delay2.delayTime.value = 1.2;
    const delay2Feedback = audioCtx.createGain();
    delay2Feedback.gain.value = 0.5;
    
    // Cross-feedback
    delay1.connect(delay1Feedback);
    delay1Feedback.connect(delay2);
    delay2.connect(delay2Feedback);
    delay2Feedback.connect(delay1);

    masterGain.connect(delay1);
    masterGain.connect(delay2);
    delay1.connect(analyser);
    delay2.connect(analyser);
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    // Deep Drones (C Maj 9 chord structure)
    const baseFreqs = [65.41, 98.00, 130.81, 164.81]; // C2, G2, C3, E3
    baseFreqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        
        // Slow LFO for frequency drifting
        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.05 + (Math.random() * 0.05);
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 1.5; // Slight detuning
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();

        const oscGain = audioCtx.createGain();
        oscGain.gain.value = 0; // Start silent
        // Slow fade in
        oscGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 10 + (i * 2));

        osc.frequency.value = freq;
        osc.connect(oscGain);
        oscGain.connect(masterGain);
        osc.start();
    });

    // Random Ethereal Swells
    const highScale = [261.63, 329.63, 392.00, 493.88, 523.25, 659.25, 783.99]; // C4, E4, G4, B4, C5, E5, G5
    function playSwell() {
        if(audioCtx.state === 'closed') return;
        
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        const freq = highScale[Math.floor(Math.random() * highScale.length)];
        osc.frequency.value = freq;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = freq * 1.5;
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        
        // Attack: 5-10s, Decay: 10-15s
        const attack = 5 + Math.random() * 5;
        const decay = 10 + Math.random() * 5;
        
        gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + attack);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + attack + decay);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        
        osc.start();
        osc.stop(audioCtx.currentTime + attack + decay + 1);
        
        // Next swell in 8-15 seconds
        setTimeout(playSwell, (8 + Math.random() * 7) * 1000);
    }
    playSwell();
}

// --- DARK HIGHWAY VISUALS (FROM 0009, MODIFIED FOR AMBIENT MOOD) ---
function init3D() {
    const container = document.getElementById('webgl-canvas');
    scene = new THREE.Scene();
    
    // Intense, suffocating black fog, slightly softer than 0009
    scene.fog = new THREE.FogExp2(0x020205, 0.015);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 20); // Low angle
    camera.lookAt(0, 0, -50);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); 
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Headlights (Spotlight pointed forward, softer color)
    const headLight1 = new THREE.SpotLight(0xaaccff, 3);
    headLight1.position.set(-2, 4, 20);
    headLight1.target.position.set(-2, 0, -100);
    headLight1.angle = Math.PI / 5;
    headLight1.penumbra = 0.8;
    headLight1.decay = 2;
    headLight1.distance = 200;
    scene.add(headLight1);
    scene.add(headLight1.target);

    const headLight2 = new THREE.SpotLight(0xaaccff, 3);
    headLight2.position.set(2, 4, 20);
    headLight2.target.position.set(2, 0, -100);
    headLight2.angle = Math.PI / 5;
    headLight2.penumbra = 0.8;
    headLight2.decay = 2;
    headLight2.distance = 200;
    scene.add(headLight2);
    scene.add(headLight2.target);

    // Deep ambient blue backglow
    const ambientLight = new THREE.AmbientLight(0x051020);
    scene.add(ambientLight);

    // Custom Shader Material for the endless road
    roadUniforms = {
        u_time: { value: 0.0 },
        u_speed: { value: 20.0 } // Slower, dreamier speed than 0009
    };

    const roadShaderMaterial = new THREE.ShaderMaterial({
        uniforms: roadUniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform float u_speed;
            varying vec2 vUv;
            
            float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

            void main() {
                vec2 uv = vUv;
                float movingV = uv.y - (u_time * u_speed);
                
                float noise = rand(uv * 1000.0) * 0.05;
                vec3 color = vec3(0.04 + noise); // Dark asphalt
                
                // Center dashed line (ethereal blue/white)
                float isCenter = step(0.49, uv.x) - step(0.51, uv.x);
                float isDash = step(0.5, fract(movingV * 0.1)); 
                vec3 lineCol = vec3(0.5, 0.7, 1.0) * (0.8 + rand(uv*50.0)*0.2); 
                
                color = mix(color, lineCol, isCenter * isDash * 0.7);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const roadGeo = new THREE.PlaneGeometry(30, 800); 
    const road = new THREE.Mesh(roadGeo, roadShaderMaterial);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -350;
    scene.add(road);

    // Soft floating particles (ethereal dust/snow instead of phantom eyes)
    const dustGeo = new THREE.OctahedronGeometry(0.1, 0);
    const dustMat = new THREE.MeshBasicMaterial({ color: 0x6688aa, transparent: true, opacity: 0.5 });
    for(let i=0; i<300; i++) {
        const dust = new THREE.Mesh(dustGeo, dustMat);
        dust.position.x = (Math.random() - 0.5) * 40;
        dust.position.y = Math.random() * 10;
        dust.position.z = -Math.random() * 400;
        dust.userData = { speed: 0.5 + Math.random() };
        scene.add(dust);
    }

    window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    roadUniforms.u_time.value += delta;

    // Gentle camera drift based on ambient music
    let ambientEnergy = 0;
    if (analyser && audioDataArray) {
        analyser.getByteFrequencyData(audioDataArray);
        let sum = 0;
        for(let i=0; i<10; i++) sum += audioDataArray[i];
        ambientEnergy = (sum / 10) / 255.0;
    }

    // Smooth, sleepy camera movement instead of violent shaking
    const time = Date.now() * 0.0002;
    camera.position.x = Math.sin(time) * (2 + ambientEnergy * 2);
    camera.position.y = 5 + Math.cos(time * 0.8) * 0.5;
    camera.lookAt(Math.sin(time*0.5)*2, 0, -50);

    // Drift particles smoothly
    scene.children.forEach(child => {
        if (child.geometry && child.geometry.type === 'OctahedronGeometry') {
            child.position.z += child.userData.speed * delta * 20; 
            child.rotation.x += 0.01;
            child.rotation.y += 0.01;
            if (child.position.z > 20) {
                child.position.z = -300 - Math.random() * 100;
            }
        }
    });

    renderer.render(scene, camera);
}
</script>
</body>
</html>
