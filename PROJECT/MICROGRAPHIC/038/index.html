<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>038 // VIGNELLI CONSTRUCTIVISM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #f4f4f4; /* Clean off-white */
            color: #111;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* The Grid */
        #grid-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; height: 90vh;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 2px;
            background: #e0e0e0; /* Grid lines color */
            border: 2px solid #111;
        }

        .cell {
            background: #f4f4f4;
            position: relative;
            overflow: hidden;
        }

        /* Constructivist Elements */
        .block-red { background: #E32636; }
        .block-black { background: #111; }
        
        .circle {
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            transform: scale(0);
        }

        .type-block {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: flex-end;
            padding: 1vw;
            font-size: 8vw;
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: #111;
            clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
        }

        .type-small {
            font-size: 1.5vw;
            font-weight: 400;
            letter-spacing: 0;
            align-items: flex-start;
            padding: 1vw;
            line-height: 1.1;
        }

        /* Overlay */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #E32636; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; gap: 20px;
            color: #fff;
        }
        #ot { font-size: 3vw; font-weight: 700; letter-spacing: -0.02em; }
        #os { font-size: 1vw; font-weight: 400; opacity: 0.8; }
    </style>
</head>
<body>

<div id="overlay" onclick="begin()">
    <div id="ot">STRUCTURE / LOGIC</div>
    <div id="os">CLICK TO INITIALIZE GRID</div>
</div>

<div id="grid-container">
    <!-- Grid cells will be generated by JS -->
</div>

<script>
const grid = document.getElementById('grid-container');
const cells = [];

// Create 144 cells (12x12)
for(let i=0; i<144; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    grid.appendChild(el);
    cells.push(el);
}

// Map layout to specific cells
function setBlock(x, y, w, h, className, innerHTML = '') {
    const el = document.createElement('div');
    el.className = className;
    el.style.gridColumn = `${x} / span ${w}`;
    el.style.gridRow = `${y} / span ${h}`;
    el.innerHTML = innerHTML;
    grid.appendChild(el);
    return el;
}

// Pre-define constructivist layout
const layout = [];

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    
    buildLayout();
    initAudio();
    animateSequence();
}

function buildLayout() {
    // Top section
    layout.push( setBlock(1, 1, 4, 4, 'cell block-red') );
    layout.push( setBlock(5, 1, 8, 2, 'cell block-black', '<div class="type-block" style="color:#fff;">ORDER</div>') );
    
    // Middle section
    layout.push( setBlock(5, 3, 4, 4, 'cell', '<div class="type-block">038</div>') );
    layout.push( setBlock(9, 3, 4, 8, 'cell', '<div class="circle block-red"></div>') );
    
    // Bottom section
    layout.push( setBlock(1, 5, 4, 8, 'cell block-black') );
    layout.push( setBlock(5, 7, 4, 6, 'cell', '<div class="type-block type-small">DESIGN IS ONE.<br>GRID IS LAW.<br>NO NOISE.</div>') );
    layout.push( setBlock(9, 11, 4, 2, 'cell block-red') );

    // Hide all initially for animation
    gsap.set('.block-red, .block-black', { scaleX: 0, transformOrigin: 'left center' });
    gsap.set('.circle', { scale: 0 });
    gsap.set('.type-block', { clipPath: 'polygon(0 100%, 100% 100%, 100% 100%, 0 100%)' });
}

// ── AUDIO ENGINE: MINIMALIST GRID SYNTHESIS ──
let tickSynth, bassSynth;

function initAudio() {
    Tone.Transport.bpm.value = 120; // Exact, structured tempo

    // Crisp, mechanical tick
    tickSynth = new Tone.MembraneSynth({
        pitchDecay: 0.01,
        octaves: 1,
        oscillator: { type: "square" },
        envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }
    }).toDestination();
    tickSynth.volume.value = -10;

    // Solid geometric bass
    bassSynth = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0.8, release: 0.5 }
    }).toDestination();
    bassSynth.volume.value = -5;

    // Grid sequence
    const loop = new Tone.Sequence((time, note) => {
        if (note === 'tick') {
            tickSynth.triggerAttackRelease("C4", "32n", time);
        } else if (note) {
            bassSynth.triggerAttackRelease(note, "16n", time);
        }
    }, [
        "C2", "tick", null, "tick", 
        "G1", null, "tick", "C2", 
        null, "tick", "Eb2", "tick", 
        "C2", "tick", null, "tick"
    ], "16n").start(0);

    Tone.Transport.start();
}

// ── VJ ENGINE: GSAP CHOREOGRAPHY ──
function animateSequence() {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 2 });

    // Step 1: Blocks snap in
    tl.to('.block-red, .block-black', {
        scaleX: 1,
        duration: 0.5,
        stagger: 0.1,
        ease: "expo.out"
    }, 0);

    // Step 2: Typography reveals
    tl.to('.type-block', {
        clipPath: 'polygon(0 0%, 100% 0%, 100% 100%, 0 100%)',
        duration: 0.8,
        stagger: 0.2,
        ease: "power3.inOut"
    }, 0.4);

    // Step 3: Circle pops in
    tl.to('.circle', {
        scale: 1,
        duration: 0.6,
        ease: "back.out(1.5)"
    }, 0.8);

    // Dynamic restructuring (Constructivist movement)
    tl.to('.block-red', {
        backgroundColor: '#111',
        duration: 0,
        delay: 1
    });
    tl.to('.block-black', {
        backgroundColor: '#E32636',
        duration: 0
    }, "<");

    tl.to('.circle', {
        borderRadius: "0%",
        scale: 0.8,
        duration: 0.5,
        ease: "power2.inOut"
    }, "+=0.5");

    // Fade out to reset
    tl.to(layout, {
        opacity: 0,
        duration: 0.5,
        ease: "power1.inOut",
        delay: 1
    });
    
    // Reset properties for next loop
    tl.set(layout, { opacity: 1 });
    tl.set('.block-red', { backgroundColor: '#E32636', scaleX: 0 });
    tl.set('.block-black', { backgroundColor: '#111', scaleX: 0 });
    tl.set('.circle', { scale: 0, borderRadius: "50%" });
    tl.set('.type-block', { clipPath: 'polygon(0 100%, 100% 100%, 100% 100%, 0 100%)' });
}
</script>
</body>
</html>
