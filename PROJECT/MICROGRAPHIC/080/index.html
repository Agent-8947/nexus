<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>080 // РЕКВИЕМ ПУСТОТЫ (REQUIEM OF THE VOID)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #020000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #550000; font-family: "Times New Roman", serif; font-size: 24px; cursor: pointer;
            letter-spacing: 15px; text-transform: uppercase; text-shadow: 0 0 20px #ff0000;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ ВНИДИТЕ В ПУСТОТУ ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;

    // Simple noise
    float noise(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * r.xy) / r.y;
        vec3 col = vec3(0.0);

        // Slow, weeping motion
        float drip = step(0.98, fract(uv.x * 50.0 + sin(t + uv.y * 10.0) * 0.1));
        float flow = t * 0.2;
        
        // Background: heavy, dark maroon gradient
        col = mix(vec3(0.05, 0.0, 0.0), vec3(0.0), length(uv));

        // Dripping blood/paint effect
        float d = abs(uv.x);
        float line = smoothstep(0.02, 0.0, d);
        
        // Add drips falling down
        float speed = 1.5;
        float y = uv.y + t * 0.1;
        float drip_pattern = step(0.95, fract(y * 10.0 + noise(vec2(floor(uv.x * 20.0), 0.0)) * 10.0));
        
        col += vec3(0.4, 0.0, 0.0) * drip_pattern * smoothstep(0.2, 0.0, abs(uv.x));
        
        // Central weeping cross
        float cross_v = smoothstep(0.02, 0.0, abs(uv.x));
        float cross_h = smoothstep(0.02, 0.0, abs(uv.y - 0.2)) * step(abs(uv.x), 0.3);
        
        float cross_mask = max(cross_v, cross_h);
        
        // Apply drip distortion to cross
        float dist = sin(uv.y * 20.0 + t) * 0.01;
        float cross_v_dist = smoothstep(0.02, 0.0, abs(uv.x + dist));
        float cross_mask_dist = max(cross_v_dist, cross_h);

        col += vec3(0.6, 0.0, 0.0) * cross_mask_dist;
        
        // Heavy Vignette
        col *= 1.0 - length(uv) * 0.8;
        
        // Flash on "beat" (very slow)
        col += vec3(0.1, 0.0, 0.0) * sin(t * 0.5);

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    window.addEventListener('resize', () => uniforms.r.value.set(innerWidth, innerHeight));
}

function initAudio() {
    Tone.Transport.bpm.value = 40; // Extremely slow

    const drone = new Tone.Oscillator(30, "sine").toDestination().start();
    drone.volume.value = -10;

    const noise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1, decay: 2, sustain: 0.5, release: 2 }
    }).toDestination();
    noise.volume.value = -20;

    const synth = new Tone.Synth({
        oscillator: { type: "sawtooth" },
        envelope: { attack: 0.5, decay: 0.5, sustain: 0.8, release: 1 }
    }).toDestination();
    synth.volume.value = -15;

    // Slow, funeral bell
    const metal = new Tone.MetalSynth({
        frequency: 50,
        envelope: { attack: 0.001, decay: 4, release: 4 },
        harmonicity: 3.1,
        modulationIndex: 16,
        resonance: 2000,
        octaves: 1.5
    }).toDestination();
    metal.volume.value = -10;

    new Tone.Loop(time => {
        metal.triggerAttackRelease("C1", "1n", time);
        synth.triggerAttackRelease("C2", "2n", time + 1);
        noise.triggerAttackRelease("2n", time);
    }, "1m").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
