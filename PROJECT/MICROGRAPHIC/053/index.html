<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>053 // PHANTOM PLEXUS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
        canvas { display: block; filter: contrast(1.5) saturate(2); }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; gap: 10px;
        }
        #ot { font-family: monospace; font-size: 20px; color: #00ff00; letter-spacing: 5px; }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">
    <div id="ot">[ INITIATE PHANTOM WEB ]</div>
</div>
<canvas id="c"></canvas>

<script>
let cv, cx, W, H;
let particles = [];
let T = 0;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    
    cv = document.getElementById('c'); 
    cx = cv.getContext('2d', { alpha: false });
    
    resize(); 
    window.addEventListener('resize', resize);
    
    initParticles();
    initAudio();
    animate();
}

function resize() { 
    W = cv.width = innerWidth; 
    H = cv.height = innerHeight; 
    cx.fillStyle = '#000000';
    cx.fillRect(0, 0, W, H);
}

function initParticles() {
    const count = window.innerWidth > 800 ? 120 : 70;
    for(let i=0; i<count; i++) {
        particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            size: Math.random() * 2 + 1,
            hue: Math.random() * 60 + 180 // Cyan/Blue tones
        });
    }
}

// ── AUDIO ENGINE: FAST IDM BEAT ──
function initAudio() {
    Tone.Transport.bpm.value = 175;

    // Glitchy IDM Kick
    const kick = new Tone.MembraneSynth({
        pitchDecay: 0.01,
        octaves: 8,
        oscillator: { type: "square" },
        envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0 }
    }).toDestination();
    kick.volume.value = 5;

    // Fast hi-hats
    const hat = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.05 }
    }).toDestination();
    hat.volume.value = -15;

    // Eerie ambient pad
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2, decay: 1, sustain: 1, release: 2 }
    }).toDestination();
    pad.volume.value = -10;

    // Beat logic
    new Tone.Loop(time => {
        // Kick on 1, 3, and random syncopations
        if (Math.random() > 0.4) kick.triggerAttackRelease("C1", "16n", time);
        
        // Rapid hats
        hat.triggerAttackRelease("32n", time);
        if (Math.random() > 0.5) hat.triggerAttackRelease("32n", time + 0.1);
        
    }, "8n").start(0);

    // Pad logic
    new Tone.Loop(time => {
        pad.triggerAttackRelease(["C4", "G4", "D5"], "1m", time);
    }, "2m").start(0);

    Tone.Transport.start();
}

function animate() {
    requestAnimationFrame(animate);
    T += 0.01;
    
    // ── LONG PHANTOM TRAIL ──
    // Instead of clearRect, we fill with extremely low opacity black
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = 'rgba(0, 0, 0, 0.02)'; // Extremely long fade
    cx.fillRect(0, 0, W, H);

    cx.globalCompositeOperation = 'lighter';

    // Update and draw particles
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        
        // Erratic movement (noise-like)
        p.vx += (Math.random() - 0.5) * 0.5;
        p.vy += (Math.random() - 0.5) * 0.5;
        
        // Speed limit
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (speed > 5) {
            p.vx = (p.vx / speed) * 5;
            p.vy = (p.vy / speed) * 5;
        }

        p.x += p.vx;
        p.y += p.vy;

        // Bounce
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;

        // Draw node
        cx.beginPath();
        cx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        cx.fillStyle = `hsl(${p.hue}, 100%, 50%)`;
        cx.fill();
    }

    // Draw Plexus lines
    cx.lineWidth = 0.5;
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            let p1 = particles[i];
            let p2 = particles[j];
            let dx = p1.x - p2.x;
            let dy = p1.y - p2.y;
            let dist = dx * dx + dy * dy;

            // Connect if close enough
            if (dist < 15000) {
                let alpha = 1 - (dist / 15000);
                cx.beginPath();
                cx.moveTo(p1.x, p1.y);
                cx.lineTo(p2.x, p2.y);
                // The line color blends with the trail over time
                cx.strokeStyle = `rgba(0, 255, 200, ${alpha * 0.5})`;
                cx.stroke();
            }
        }
    }
}
</script>
</body>
</html>
