<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>026 // MUTATED DNA VJ SET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;background:#0a0505;overflow:hidden}
canvas{display:block;filter:contrast(1.8) saturate(1.5) brightness(0.75)}
#vig{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 0%,rgba(0,0,0,1) 90%);z-index:15;pointer-events:none}
.bar{position:absolute;left:0;width:100%;height:12%;background:#000;z-index:20;pointer-events:none}
#bt{top:0}#bb{bottom:0}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#0c0000;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;gap:20px}
#ot{font-family:'Times New Roman',serif;font-size:14px;letter-spacing:14px;color:#f22;text-transform:uppercase;text-shadow:0 0 15px rgba(255,0,0,0.8)}
#os{font-family:'Times New Roman',serif;font-style:italic;font-size:12px;color:#666;letter-spacing:4px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:0.2}}
#tc{position:absolute;top:13%;right:3%;font-family:monospace;font-size:10px;color:rgba(255,50,50,0.5);z-index:30;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div id="overlay" onclick="begin()">
<div id="ot">026 // MUTATED DNA</div>
<div id="os">initiate sequence</div>
</div>
<div id="vig"></div>
<div class="bar" id="bt"></div>
<div class="bar" id="bb"></div>
<div id="tc">00:00:00</div>
<canvas id="c"></canvas>

<script>
let ax,st,cv,cx,W,H,T=0;
let glitchIntensity=0;
let invert=false;

function begin(){
    document.getElementById('overlay').style.display='none';
    ax=new(window.AudioContext||window.webkitAudioContext)();
    cv=document.getElementById('c');cx=cv.getContext('2d');
    resize();window.addEventListener('resize',resize);
    initAudio();
    st=Date.now();
    setInterval(()=>{if(!st)return;const s=Math.floor((Date.now()-st)/1000);document.getElementById('tc').textContent=`00:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},1000);
    animate();
}

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}

// ── AUDIO: RHYTHMIC BEEPS & DRONE ──
let _m;
function initAudio(){
    _m=ax.createGain();_m.gain.value=0.5;_m.connect(ax.destination);
    
    // Drone
    const d=ax.createOscillator();d.type='triangle';d.frequency.value=42;
    const g=ax.createGain();g.gain.value=0.5;
    d.connect(g);g.connect(_m);d.start();
    
    // Rhythmic beeps
    function beep(){
        if(!ax||ax.state==='closed')return;
        const now=ax.currentTime;
        const o=ax.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(1000,now);
        o.frequency.exponentialRampToValueAtTime(100,now+0.1);
        
        const og=ax.createGain();og.gain.setValueAtTime(0.3,now);og.gain.exponentialRampToValueAtTime(0.001,now+0.1);
        
        o.connect(og);og.connect(_m);o.start(now);o.stop(now+0.1);
        
        glitchIntensity = 1.0;
        setTimeout(beep, 250);
    }
    setTimeout(beep, 1000);
}

// ── VJ ENGINE: MUTATED DNA ──
function drawDNA() {
    const strands = 2;
    const points = 50;
    const spacing = W / points;
    
    for(let s=0; s<strands; s++) {
        cx.beginPath();
        for(let i=0; i<points; i++) {
            const x = i * spacing;
            const angle = T*5 + i*0.5 + s*Math.PI;
            const y = H/2 + Math.sin(angle)*100 * Math.sin(T*2);
            
            if(i===0) cx.moveTo(x, y);
            else cx.lineTo(x, y);
            
            // Draw nodes
            cx.save();
            cx.beginPath();
            cx.arc(x, y, 3 + glitchIntensity*5, 0, Math.PI*2);
            cx.fill();
            cx.restore();
        }
        cx.stroke();
    }
    
    // Draw connecting lines
    for(let i=0; i<points; i+=2) {
        const x = i * spacing;
        const angle1 = T*5 + i*0.5;
        const angle2 = T*5 + i*0.5 + Math.PI;
        const y1 = H/2 + Math.sin(angle1)*100 * Math.sin(T*2);
        const y2 = H/2 + Math.sin(angle2)*100 * Math.sin(T*2);
        
        cx.beginPath();
        cx.moveTo(x, y1);
        cx.lineTo(x, y2);
        cx.stroke();
    }
}

function animate(){
    requestAnimationFrame(animate);
    T+=0.016;
    
    glitchIntensity *= 0.88;
    if(Math.random()>0.97) invert = !invert;
    
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = invert ? 'rgba(255,200,200,0.1)' : 'rgba(5,2,2,0.2)';
    cx.fillRect(0, 0, W, H);
    
    cx.globalCompositeOperation = invert ? 'difference' : 'screen';
    
    const offset = Math.sin(T*12) * 15 * glitchIntensity;
    
    cx.save();
    cx.lineWidth = 2;
    
    // RED
    cx.save(); cx.translate(offset, 0); cx.strokeStyle = '#ff0000'; cx.fillStyle = '#ff0000'; drawDNA(); cx.restore();
    // GREEN
    cx.save(); cx.translate(-offset, offset); cx.strokeStyle = '#00ff00'; cx.fillStyle = '#00ff00'; drawDNA(); cx.restore();
    // BLUE
    cx.save(); cx.translate(0, -offset); cx.strokeStyle = '#0000ff'; cx.fillStyle = '#0000ff'; drawDNA(); cx.restore();
    
    cx.restore();
    cx.globalCompositeOperation = 'source-over';
}
</script>
</body>
</html>
