<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>034 // PLASMA FLOW</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050005;
            overflow: hidden;
            font-family: monospace;
        }
        canvas { 
            display: block; 
            filter: contrast(1.4) saturate(2.0) drop-shadow(0 0 20px rgba(255, 0, 255, 0.3));
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 3s ease;
            color: #ff33aa;
            font-size: 14px;
            letter-spacing: 12px;
            text-shadow: 0 0 15px #ff00aa;
            font-style: italic;
        }
        .pulse-text {
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe { 
            0% { opacity: 0.3; transform: scale(0.98); } 
            50% { opacity: 1; transform: scale(1.02); } 
            100% { opacity: 0.3; transform: scale(0.98); } 
        }
    </style>
</head>
<body>

<div id="overlay" onclick="initAudio()">
    <div class="pulse-text">[ BREATHE IN ]</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio Setup - Warm, Deep Purple Pad
let audioCtx;
let analyser;
let dataArray;
let heartbeatPulse = 0;

function initAudio() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 3000);

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.9;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    // Warm Pad
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    
    osc1.type = 'sine';
    osc2.type = 'sine';
    
    osc1.frequency.value = 110.00; // A2
    osc2.frequency.value = 110.6; // Slight detune
    
    const padGain = audioCtx.createGain();
    padGain.gain.value = 0.15;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 350;
    
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(padGain);
    
    const breathLfo = audioCtx.createOscillator();
    breathLfo.type = 'sine';
    breathLfo.frequency.value = 0.12; // 8-second breath cycle
    const breathGain = audioCtx.createGain();
    breathGain.gain.value = 0.1;
    
    breathLfo.connect(breathGain);
    breathGain.connect(padGain.gain);
    
    padGain.connect(analyser);
    
    function playHeartbeat() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
        heartbeatPulse = 1.0;
        setTimeout(playHeartbeat, 2800);
    }

    analyser.connect(audioCtx.destination);
    osc1.start();
    osc2.start();
    breathLfo.start();
    playHeartbeat();
}

// Visuals: Plasma Flow
const numParticles = 200; 
const particles = [];

for (let i = 0; i < numParticles; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: 50 + Math.random() * 100,
        angle: Math.random() * Math.PI * 2,
        speed: 0.005 + Math.random() * 0.005,
        phase: Math.random() * Math.PI * 2
    });
}

let tick = 0;

function loop() {
    tick += 1;
    heartbeatPulse *= 0.95;

    let audioIntensity = 0;
    if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 10; i++) sum += dataArray[i];
        audioIntensity = sum / 10;
    }

    const visualBreath = Math.sin(tick * 0.02);

    // Feedback zoom (heavy)
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(width / 2, height / 2);
    ctx.scale(1.005 + visualBreath * 0.005, 1.005 + visualBreath * 0.005);
    ctx.rotate(0.001);
    ctx.translate(-width / 2, -height / 2);
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();

    ctx.fillStyle = `rgba(5, 0, 5, 0.05)`;
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'lighter';

    const baseHue = 300 + Math.sin(tick * 0.004) * 40; // Magenta to Purple

    // Draw plasma flows
    for (let p of particles) {
        p.angle += p.speed * (1 + audioIntensity/50);
        
        const x = width/2 + Math.cos(p.angle) * (p.radius + visualBreath*20);
        const y = height/2 + Math.sin(p.angle) * (p.radius + visualBreath*20);

        const size = 2 + Math.sin(tick * 0.05 + p.phase) * 1 + heartbeatPulse * 3;
        const alpha = 0.05 + (Math.sin(tick * 0.02 + p.phase) * 0.5 + 0.5) * 0.1;

        ctx.fillStyle = `hsla(${baseHue}, 100%, 70%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();

        // Draw connections to center
        ctx.strokeStyle = `hsla(${baseHue}, 100%, 60%, ${alpha * 0.5})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(width/2, height/2);
        ctx.stroke();
    }
    
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
