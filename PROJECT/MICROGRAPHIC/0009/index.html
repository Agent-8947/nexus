<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0009 // LOST HIGHWAY (OMNIOUS INDUSTRIAL DRONE)</title>
    <!-- Three.js for 3D Environment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-weight: bold;
        }
        #webgl-canvas { 
            width: 100%; height: 100%; 
            display: block; 
            /* Cinematic noise and color grading */
            filter: contrast(1.3) brightness(0.9) sepia(0.2) hue-rotate(-20deg);
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            color: #ffcc00; font-size: 13px; letter-spacing: 15px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            transition: opacity 3s ease-in;
        }
        .flicker { animation: flicker 0.15s infinite; }
        @keyframes flicker { 
            0% { opacity: 1; } 
            50% { opacity: 0.8; } 
            100% { opacity: 0.9; } 
        }
    </style>
</head>
<body>
<div id="overlay" onclick="initLostHighway()">
    <div class="flicker">DRIVE IN THE DARK</div>
</div>
<div id="webgl-canvas"></div>
<script>
let audioCtx, analyser;
let scene, camera, renderer;
let roadUniforms;
let engineLFO;

function initLostHighway() {
    const overlay = document.getElementById('overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 3000);

    initAudio();
    init3D();
    animate();
}

// --- DARK INDUSTRIAL AUDIO ENGINE (DAVID LYNCH / BADALAMENTI / REZNOR STYLE) ---
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;

    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    // 1. Ominous Bass Drone (Low growling sawtooth)
    const droneOsc = audioCtx.createOscillator();
    droneOsc.type = 'sawtooth';
    droneOsc.frequency.value = 41.20; // E1 (very low)
    
    // Slow detune modulation for creepiness
    const detuneLFO = audioCtx.createOscillator();
    detuneLFO.type = 'sine';
    detuneLFO.frequency.value = 0.1;
    const detuneGain = audioCtx.createGain();
    detuneGain.gain.value = 10;
    detuneLFO.connect(detuneGain);
    detuneGain.connect(droneOsc.detune);
    detuneLFO.start();

    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 150; // Muffled, dark
    droneFilter.Q.value = 5;

    const droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.6;

    droneOsc.connect(droneFilter);
    droneFilter.connect(droneGain);
    droneGain.connect(masterGain);
    droneOsc.start();

    // 2. Engine/Heartbeat Pulse (Industrial rhythm)
    function playPulse() {
        if(audioCtx.state === 'closed') return;
        
        const pulseOsc = audioCtx.createOscillator();
        pulseOsc.type = 'triangle';
        pulseOsc.frequency.value = 60; // Thud
        
        const pulseGain = audioCtx.createGain();
        pulseGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        pulseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        // Pitch drop for kick drum effect
        pulseOsc.frequency.setValueAtTime(80, audioCtx.currentTime);
        pulseOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);

        const pulseDist = audioCtx.createWaveShaper();
        pulseDist.curve = makeDistortionCurve(100);

        pulseOsc.connect(pulseDist);
        pulseDist.connect(pulseGain);
        pulseGain.connect(masterGain);
        
        pulseOsc.start();
        pulseOsc.stop(audioCtx.currentTime + 0.3);
        
        // Rhythmic pulsing mimicking a car on an endless road
        setTimeout(playPulse, 400 + (Math.random() * 20 - 10)); // Slight human/mechanical jitter
    }
    playPulse();

    // 3. Creepy Industrial Noise Sweeps (Passing cars or phantoms)
    function playSweep() {
        if(audioCtx.state === 'closed') return;
        
        const bufferSize = audioCtx.sampleRate * 2.0;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 10;
        
        // Sweep frequency up or down
        const startFreq = 200 + Math.random() * 800;
        const endFreq = 2000 + Math.random() * 2000;
        filter.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 2.0);
        
        const sweepGain = audioCtx.createGain();
        sweepGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        sweepGain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1.0);
        sweepGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
        
        // Panning to simulate passing by
        const panner = audioCtx.createStereoPanner();
        panner.pan.setValueAtTime(Math.random() > 0.5 ? -1 : 1, audioCtx.currentTime);
        panner.pan.linearRampToValueAtTime(panner.pan.value * -1, audioCtx.currentTime + 2.0);

        noise.connect(filter);
        filter.connect(sweepGain);
        sweepGain.connect(panner);
        panner.connect(masterGain);
        
        noise.start();
        noise.stop(audioCtx.currentTime + 2.0);
        
        setTimeout(playSweep, 5000 + Math.random() * 15000); // Rare, unexpected
    }
    playSweep();
}

function makeDistortionCurve(amount) {
  let k = typeof amount === 'number' ? amount : 50,
    n_samples = 44100, curve = new Float32Array(n_samples),
    deg = Math.PI / 180, i = 0, x;
  for ( ; i < n_samples; ++i ) {
    x = i * 2 / n_samples - 1;
    curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
  }
  return curve;
}

// --- 3D HIGHWAY ENGINE (THREE.JS) ---
function init3D() {
    const container = document.getElementById('webgl-canvas');
    scene = new THREE.Scene();
    
    // Intense, suffocating black fog
    scene.fog = new THREE.Fog(0x000000, 10, 120);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 20); // Low angle, hovering above the road
    camera.lookAt(0, 0, -50);

    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false }); // No antialiasing for gritty look
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Headlights (Spotlight pointed forward)
    const headLight1 = new THREE.SpotLight(0xffffee, 5);
    headLight1.position.set(-2, 4, 20);
    headLight1.target.position.set(-2, 0, -100);
    headLight1.angle = Math.PI / 6;
    headLight1.penumbra = 0.5;
    headLight1.decay = 2;
    headLight1.distance = 150;
    scene.add(headLight1);
    scene.add(headLight1.target);

    const headLight2 = new THREE.SpotLight(0xffffee, 5);
    headLight2.position.set(2, 4, 20);
    headLight2.target.position.set(2, 0, -100);
    headLight2.angle = Math.PI / 6;
    headLight2.penumbra = 0.5;
    headLight2.decay = 2;
    headLight2.distance = 150;
    scene.add(headLight2);
    scene.add(headLight2.target);

    // Faint red taillights glow behind the camera
    const tailLight = new THREE.PointLight(0xff0000, 2, 50);
    tailLight.position.set(0, 2, 30);
    scene.add(tailLight);

    // Custom Shader Material for the endless scrolling road
    roadUniforms = {
        u_time: { value: 0.0 },
        u_speed: { value: 60.0 } // Insanely fast speed
    };

    const roadShaderMaterial = new THREE.ShaderMaterial({
        uniforms: roadUniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform float u_speed;
            varying vec2 vUv;
            
            // Random noise function
            float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

            void main() {
                // Scroll the V coordinate to simulate forward motion
                vec2 uv = vUv;
                float movingV = uv.y - (u_time * u_speed);
                
                // Asphalt texture (dark, noisy)
                float noise = rand(uv * 1000.0) * 0.1;
                vec3 color = vec3(0.08 + noise); // Dark gray asphalt
                
                // Center dashed yellow line
                float isCenter = step(0.48, uv.x) - step(0.52, uv.x);
                float isDash = step(0.5, fract(movingV * 0.2)); // Dash frequency
                vec3 yellow = vec3(1.0, 0.8, 0.0) * (0.8 + rand(uv*100.0)*0.2); // Gritty yellow
                
                // Edge white lines
                float isLeftEdge = step(0.1, uv.x) - step(0.12, uv.x);
                float isRightEdge = step(0.88, uv.x) - step(0.9, uv.x);
                vec3 white = vec3(0.7) * (0.8 + rand(uv*100.0)*0.2);
                
                // Blend lines onto asphalt
                color = mix(color, yellow, isCenter * isDash);
                color = mix(color, white, isLeftEdge + isRightEdge);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const roadGeo = new THREE.PlaneGeometry(30, 400); // Narrow, extremely long road
    const road = new THREE.Mesh(roadGeo, roadShaderMaterial);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -150;
    scene.add(road);

    // Phantom objects rushing past (red eyes/lights in the dark)
    const phantomGeo = new THREE.SphereGeometry(0.2, 8, 8);
    const phantomMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    for(let i=0; i<20; i++) {
        const phantom = new THREE.Mesh(phantomGeo, phantomMat);
        // Position them off the road
        phantom.position.x = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 10);
        phantom.position.y = 1 + Math.random() * 2;
        phantom.position.z = -Math.random() * 400;
        scene.add(phantom);
    }

    window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    roadUniforms.u_time.value += delta;

    // Audio reactivity: camera shake/vibration based on drone and pulse
    let vibration = 0;
    if (analyser) {
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);
        // Look at low frequencies for rumble
        vibration = (dataArray[2] / 255.0) * 0.15;
    }

    // Unsettling camera shake
    camera.position.x = (Math.random() - 0.5) * vibration;
    camera.position.y = 5 + (Math.random() - 0.5) * vibration;

    // Move phantoms past the camera
    scene.children.forEach(child => {
        if (child.geometry && child.geometry.type === 'SphereGeometry') {
            child.position.z += 80 * delta; // Fast movement
            if (child.position.z > 50) {
                child.position.z = -300 - Math.random() * 200; // Reset far away
            }
        }
    });

    renderer.render(scene, camera);
}
</script>
</body>
</html>
