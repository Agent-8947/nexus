<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>060 // BAPTISM BY FIRE (КРЕЩЕНИЕ ОГНЕМ)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: serif; cursor: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; align-items: center;
            justify-content: center; color: #ff0000; font-size: 24px; letter-spacing: 5px; cursor: pointer;
        }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            pointer-events: none; mix-blend-mode: exclusion;
        }
        .cross {
            width: 20px; height: 80vh; background: #ff0000; position: relative;
        }
        .cross::after {
            content: ''; position: absolute; top: 25%; left: -30vh;
            width: 60vh; height: 20px; background: #ff0000;
        }
        .text {
            position: absolute; color: #fff; font-size: 15vw; font-weight: 900;
            text-shadow: 5px 5px 0px #f00; opacity: 0;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ КРЕЩЕНИЕ ОГНЕМ ]</div>
<div id="ui">
    <div class="cross"></div>
    <div class="text" id="t1">ОГНЬ</div>
</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;
    
    // Hash function
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    // Value noise
    float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
    }
    // FBM
    float fbm(vec2 p) {
        float v = 0.0; float a = 0.5;
        vec2 shift = vec2(100.0);
        mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
        for (int i = 0; i < 5; ++i) {
            v += a * noise(p);
            p = rot * p * 2.0 + shift;
            a *= 0.5;
        }
        return v;
    }

    void main() {
        vec2 uv = gl_FragCoord.xy / r.xy;
        vec2 p = uv * 5.0;
        
        // Flowing upwards like fire
        float q = fbm(p - vec2(0.0, t * 2.0));
        float fire = fbm(p + vec2(q, t * 3.0));
        
        // Deep black metal colors: black, dark red, crimson, dark orange
        vec3 col = mix(vec3(0.0, 0.0, 0.0), vec3(0.5, 0.0, 0.0), fire);
        col = mix(col, vec3(1.0, 0.2, 0.0), pow(fire, 3.0));
        
        // Vignette
        col *= smoothstep(1.2, 0.3, distance(uv, vec2(0.5)));

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
}

function initAudio() {
    Tone.Transport.bpm.value = 240; // EXTREME BLAST BEAT TEMPO

    const kick = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 8 }).toDestination();
    const kickDist = new Tone.Distortion(2).toDestination();
    kick.connect(kickDist);
    kick.volume.value = 5;

    const snare = new Tone.NoiseSynth({ noise: {type:"white"}, envelope: {attack:0.001, decay:0.1} }).toDestination();
    snare.volume.value = -5;

    // Tremolo picked guitar simulation (Wall of sound)
    const tremolo = new Tone.PolySynth(Tone.FMSynth, {
        harmonicity: 1.5,
        modulationIndex: 5,
        oscillator: { type: "sawtooth" }
    }).toDestination();
    const tremDist = new Tone.Distortion(4).toDestination();
    const tremReverb = new Tone.Reverb(4).connect(tremDist);
    tremolo.connect(tremReverb);
    tremolo.volume.value = -10;

    let step = 0;
    const chords = [["E2", "B2", "E3"], ["F2", "C3", "F3"], ["E2", "B2", "E3"], ["Eb2", "Bb2", "Eb3"]];

    new Tone.Loop(time => {
        // Continuous blast beat
        kick.triggerAttackRelease("C1", "16n", time);
        if(step % 2 === 0) snare.triggerAttackRelease("32n", time);
        
        // Tremolo picking 16th notes
        let chord = chords[Math.floor((step / 32) % 4)];
        tremolo.triggerAttackRelease(chord, "16n", time);

        // Flash text
        if(step % 64 === 0) {
            let el = document.getElementById('t1');
            el.style.opacity = 1;
            setTimeout(()=>el.style.opacity = 0, 100);
        }

        step++;
    }, "16n").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
