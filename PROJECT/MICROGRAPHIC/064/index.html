<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>064 // STIGMATA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #ff0000; font-family: serif; font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ СТИГМАТЫ ]</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
    uniform float t;
    uniform vec2 r;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
    }

    void main() {
        vec2 uv = gl_FragCoord.xy / r.xy;
        
        // Base gold background (The Icon)
        vec3 gold = vec3(0.8, 0.6, 0.1);
        gold *= noise(uv * 10.0) * 0.5 + 0.5; // Texture
        
        // Dripping blood / black ichor
        // We stretch coordinates vertically and add time to Y
        vec2 dripUV = uv;
        dripUV.y *= 0.1;
        dripUV.y -= t * 0.5;
        
        float drip = noise(dripUV * 50.0);
        // Threshold to create sharp lines
        drip = smoothstep(0.7, 0.72, drip);
        
        // The blood slows down near the bottom (viscosity)
        drip *= smoothstep(0.0, 0.5, uv.y + noise(vec2(uv.x*10.0, t))*0.2);

        // Mix gold with black/red blood
        vec3 blood = vec3(0.1, 0.0, 0.0);
        vec3 col = mix(gold, blood, drip);
        
        // Vignette
        col *= smoothstep(1.0, 0.2, distance(uv, vec2(0.5)));

        gl_FragColor = vec4(col, 1.0);
    }
</script>

<script>
let scene, camera, renderer, uniforms;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); initAudio(); animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(innerWidth, innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { r: { value: new THREE.Vector2(innerWidth, innerHeight) }, t: { value: 0 } };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
}

function initAudio() {
    Tone.Transport.bpm.value = 60; // Slow, agonizing doom metal pace

    // Dark haunting choral pad
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2, decay: 1, sustain: 1, release: 3 }
    });
    const dist = new Tone.Distortion(0.5).toDestination();
    const rev = new Tone.Reverb(8).connect(dist);
    pad.connect(rev);
    pad.volume.value = -5;

    // Huge crashing distortion impact
    const crash = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.01, decay: 2 } }).toDestination();
    const cDist = new Tone.Distortion(4).toDestination();
    crash.connect(cDist);
    crash.volume.value = 2;

    const chords = [["C2", "G2", "Eb3"], ["Ab1", "Eb2", "C3"]];
    let step = 0;

    new Tone.Loop(time => {
        pad.triggerAttackRelease(chords[step % 2], "1m", time);
        if(step % 2 === 0) crash.triggerAttackRelease("4n", time);
        step++;
    }, "1m").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
}
</script>
</body>
</html>
