<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>075 // ORIGIN SWARM (РОЙ ИСТОКА)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #030001; overflow: hidden; cursor: none; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10; display: flex; align-items: center;
            justify-content: center; color: #fff; font-family: monospace; font-size: 24px; cursor: pointer;
            letter-spacing: 15px; text-transform: uppercase;
        }
        #c { width: 100%; height: 100%; filter: contrast(1.5) brightness(1.2); }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ INITIATE BIOGENESIS ]</div>
<canvas id="c"></canvas>

<script>
let cx, W, H;
let swarm = [];
let target = { x: 0, y: 0 };
const SWARM_SIZE = 800;

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    const cv = document.getElementById('c'); 
    cx = cv.getContext('2d', { alpha: false });
    W = cv.width = innerWidth; 
    H = cv.height = innerHeight;
    target.x = W / 2;
    target.y = H / 2;
    
    initSwarm(); initAudio(); animate();
    
    // Target follows mouse if moved, otherwise stays in center
    window.addEventListener('mousemove', (e) => {
        target.x = e.clientX;
        target.y = e.clientY;
    });
}

function initSwarm() {
    for(let i = 0; i < SWARM_SIZE; i++) {
        // Start from the edges
        let edge = Math.random();
        let px, py;
        if(edge < 0.25) { px = Math.random()*W; py = 0; }
        else if(edge < 0.5) { px = Math.random()*W; py = H; }
        else if(edge < 0.75) { px = 0; py = Math.random()*H; }
        else { px = W; py = Math.random()*H; }

        swarm.push({
            x: px, y: py,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            speed: 2 + Math.random() * 4,
            wobbleSpeed: 0.1 + Math.random() * 0.3,
            wobbleOffset: Math.random() * Math.PI * 2,
            tail: []
        });
    }
}

function initAudio() {
    Tone.Transport.bpm.value = 130;

    // The destination pulse (The Ovum)
    const heart = new Tone.MembraneSynth({
        pitchDecay: 0.2, octaves: 4, envelope: { attack: 0.05, decay: 0.5, sustain: 0, release: 1 }
    }).toDestination();
    heart.volume.value = 2;

    // The swarm noise (Millions of tails whipping)
    const rustle = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
    });
    const filter = new Tone.Filter(3000, "highpass").toDestination();
    rustle.connect(filter);
    rustle.volume.value = -12;

    // Heartbeat pattern
    new Tone.Loop(time => {
        heart.triggerAttackRelease("C1", "8n", time);
        heart.triggerAttackRelease("C1", "8n", time + 0.3); // Double beat
    }, "1n").start(0);

    // Chaotic swarming rhythm
    new Tone.Loop(time => {
        if(Math.random() > 0.3) {
            rustle.triggerAttackRelease("32n", time);
        }
    }, "16n").start(0);

    Tone.Transport.start();
}

let globalTime = 0;

function animate() {
    requestAnimationFrame(animate);
    globalTime++;

    // Viscous fluid background clear
    cx.fillStyle = 'rgba(5, 0, 2, 0.15)'; // Deep biological maroon
    cx.fillRect(0, 0, W, H);

    // Draw the target / source
    let pulse = Math.sin(globalTime * 0.1) * 20;
    cx.beginPath();
    cx.arc(target.x, target.y, 50 + pulse, 0, Math.PI * 2);
    let grad = cx.createRadialGradient(target.x, target.y, 10, target.x, target.y, 70 + pulse);
    grad.addColorStop(0, 'rgba(255, 200, 220, 0.8)');
    grad.addColorStop(1, 'rgba(255, 100, 150, 0.0)');
    cx.fillStyle = grad;
    cx.fill();

    // Update and draw swarm
    for(let i = 0; i < swarm.length; i++) {
        let p = swarm[i];

        // Vector to target
        let dx = target.x - p.x;
        let dy = target.y - p.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 50) {
            // Reached target, reset to edge
            p.x = Math.random() < 0.5 ? (Math.random() < 0.5 ? 0 : W) : Math.random() * W;
            p.y = Math.random() < 0.5 ? (Math.random() < 0.5 ? 0 : H) : Math.random() * H;
            p.tail = [];
            continue;
        }

        // Normalize direction
        let dirX = dx / dist;
        let dirY = dy / dist;

        // Add swimming wobble (flagella motion)
        let perpX = -dirY;
        let perpY = dirX;
        let wobble = Math.sin(globalTime * p.wobbleSpeed + p.wobbleOffset) * 2.0;

        // Velocity interpolation (smooth turning)
        p.vx = p.vx * 0.9 + (dirX * p.speed + perpX * wobble) * 0.1;
        p.vy = p.vy * 0.9 + (dirY * p.speed + perpY * wobble) * 0.1;

        p.x += p.vx;
        p.y += p.vy;

        // Record tail
        p.tail.unshift({x: p.x, y: p.y});
        if(p.tail.length > 15) p.tail.pop();

        // Draw tail
        if(p.tail.length > 1) {
            cx.beginPath();
            cx.moveTo(p.tail[0].x, p.tail[0].y);
            for(let j = 1; j < p.tail.length; j++) {
                cx.lineTo(p.tail[j].x, p.tail[j].y);
            }
            cx.strokeStyle = `rgba(255, 255, 255, ${0.4 - (i % 2 === 0 ? 0.2 : 0)})`;
            cx.lineWidth = 1.5;
            cx.stroke();
        }

        // Draw head
        cx.fillStyle = '#ffffff';
        cx.beginPath();
        cx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        cx.fill();
    }
}
</script>
</body>
</html>
