<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>056 // RADIATION SICKNESS AND DEATH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: none; }
        canvas { display: block; filter: contrast(1.5) saturate(0.5); }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; color: #aaff00;
            font-family: monospace; font-size: 24px; text-transform: uppercase; letter-spacing: 5px;
        }
        .dosimeter {
            position: absolute; bottom: 20px; left: 20px; color: #aaff00;
            font-family: monospace; font-size: 16px; z-index: 10; pointer-events: none;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>
<div id="overlay" onclick="begin()">[ EXPOSURE IMMINENT ]</div>
<div class="dosimeter" id="dosimeter">RAD: 0.00 μSv/h</div>
<canvas id="c"></canvas>

<script id="vs" type="x-shader/x-vertex">
    void main() { gl_Position = vec4(position, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
    uniform vec2 r;
    uniform float t;
    uniform float intensity;

    // Random noise generator
    float rand(vec2 co){
        return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
    }

    void main() {
        vec2 uv = gl_FragCoord.xy / r.xy;
        
        // Base toxic green
        vec3 color = vec3(0.1, 0.4, 0.1);
        
        // Film grain / Radiation strikes on sensor
        float noise = rand(uv * t);
        
        // Simulating cellular decay (blobs merging and separating)
        float decay = sin(uv.x * 20.0 + t) * cos(uv.y * 20.0 - t) + sin(uv.x * 50.0 + t*2.0);
        decay = smoothstep(0.0, 1.0, decay);
        
        // Black necrosis
        color *= decay;
        
        // Radiation burn flashes
        if (noise > 0.99 - (intensity * 0.1)) {
            color = vec3(1.0, 1.0, 1.0); // White pixel strikes
        }
        
        // Final toxic tint
        color.g += intensity * 0.2;
        color.r += intensity * 0.05;
        
        // Heavy vignette
        float dist = distance(uv, vec2(0.5));
        color *= smoothstep(0.8, 0.2, dist);

        gl_FragColor = vec4(color, 1.0);
    }
</script>

<script>
let renderer, scene, camera, uniforms;
let phase = 0; // 0.0 to 1.0 cycle of sickness

async function begin() {
    document.getElementById('overlay').style.display = 'none';
    await Tone.start();
    initGPU(); 
    initAudio(); 
    animate();
}

function initGPU() {
    renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene = new THREE.Scene();
    
    uniforms = { 
        r: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }, 
        t: { value: 0 },
        intensity: { value: 0 }
    };
    
    const mat = new THREE.ShaderMaterial({
        uniforms: uniforms, 
        vertexShader: document.getElementById('vs').textContent, 
        fragmentShader: document.getElementById('fs').textContent
    });
    
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.r.value.set(window.innerWidth, window.innerHeight);
    });
}

function initAudio() {
    Tone.Transport.bpm.value = 120;

    // Geiger Counter Click
    const geiger = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.01, sustain: 0, release: 0 }
    }).toDestination();
    geiger.volume.value = 5;

    // High frequency tinnitus (Radiation Sickness symptom)
    const tinnitus = new Tone.Oscillator(11000, "sine").toDestination().start();
    tinnitus.volume.value = -100; // start silent

    // Deep drone of the reactor
    const reactor = new Tone.FMSynth({
        harmonicity: 0.5,
        modulationIndex: 10,
        oscillator: { type: "sine" },
        envelope: { attack: 1, decay: 0, sustain: 1, release: 1 }
    }).toDestination();
    reactor.volume.value = -10;
    reactor.triggerAttack("C1");

    // Audio loop simulating a 15-second exposure cycle to lethal dose
    new Tone.Loop(time => {
        // Phase goes from 0 to 1 over 15 seconds, then snaps back to 0 (death & rebirth)
        phase = (Tone.Transport.seconds % 15) / 15;
        
        // Probability of a Geiger click increases exponentially
        let probability = Math.pow(phase, 2); 
        
        if (Math.random() < probability) {
            geiger.triggerAttackRelease("64n", time);
            
            // Randomly trigger clusters of clicks if radiation is high
            if (phase > 0.7 && Math.random() > 0.5) {
                geiger.triggerAttackRelease("64n", time + 0.05);
                geiger.triggerAttackRelease("64n", time + 0.1);
            }
        }

        // Tinnitus gets louder as sickness progresses
        if (phase > 0.3) {
            tinnitus.volume.rampTo(-15 + (phase * 10), 0.1);
        } else {
            tinnitus.volume.rampTo(-100, 0.1);
        }

        // Reactor gets more unstable
        reactor.modulationIndex.value = 10 + (phase * 50);

    }, "32n").start(0);

    Tone.Transport.start();
}

function animate(time) {
    requestAnimationFrame(animate);
    
    uniforms.t.value = time * 0.001;
    uniforms.intensity.value = phase; // Pass radiation level to shader

    // Update UI dosimeter
    let rads = (Math.pow(phase, 4) * 15000).toFixed(2);
    let status = phase > 0.9 ? "LETHAL" : (phase > 0.6 ? "CRITICAL" : "ELEVATED");
    document.getElementById('dosimeter').innerText = `RAD: ${rads} μSv/h [${status}]`;

    // Camera shake at extreme levels
    if (phase > 0.8) {
        let shake = (phase - 0.8) * 0.05;
        camera.position.x = (Math.random() - 0.5) * shake;
        camera.position.y = (Math.random() - 0.5) * shake;
        camera.updateProjectionMatrix();
    } else {
        camera.position.set(0,0,0);
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
