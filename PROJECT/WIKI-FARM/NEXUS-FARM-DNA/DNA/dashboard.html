<html lang="en">
<head>

    <style>
        :root {
            --bg-deep: #0a0a0e;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --danger: #ff3366;
            --warning: #ffcc00;
            --success: #33ff77;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep) radial-gradient(circle at 50% 0, rgba(0, 255, 204, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(-20px);
        }
        h1 {
            font-weight: 800;
            font-size: 3rem;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; letter-spacing: 1px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            padding: 1.5rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(30px);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }
        .domain-name { font-size: 1.4rem; font-weight: 600; color: #fff; }
        .score-badge {
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .agent-list {
            margin-top: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            opacity: 0;
            transform: translateY(30px);
        }
        .agent-list h2 { text-align: center; margin-bottom: 1.5rem; font-weight: 600; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        th {
            color: var(--text-muted);
            font-weight: 400;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .agent-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #fff;
        }
        
        .tier-S { color: #e024ff; text-shadow: 0 0 10px rgba(224,36,255,0.5); }
        .tier-A { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .tier-B { color: var(--success); }
        .tier-C { color: #33aaff; }
        .tier-D { color: var(--warning); }
        .tier-F { color: var(--danger); text-shadow: 0 0 10px rgba(255,51,102,0.5); }
        
        .issues-tag {
            display: inline-block;
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            margin-bottom: 0.2rem;
        }
        
        canvas { max-height: 200px; margin-top: 1rem; }
    </style>
</head>

            });

        allAgents.sort((a, b) => b.fitness - a.fitness);

            const tierClass = "tier-" + tierShort;
            
            let issuesHtml = "";
            if (agent.issues && agent.issues.length > 0) {
