        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;

            --ac: #ff3b30;
            --ac2: #ff6b5b;
            --cy: #00e5ff;
            --tx: #e8e8f0;
            --tx2: #8888aa;
            --bd: rgba(255,255,255,.06);
            --gw: rgba(255,59,48,.15);
            --star: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--tx);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
        }
        ::selection { background: var(--ac); color: #fff; }

        /* ─── SIDEBAR (LEFT) ─── */
        .sidebar {
            width: 320px; height: 100vh; background: #020617; position: fixed;
            left: 0; top: 0; border-right: 1px solid var(--bd); padding: 2.5rem;
            box-sizing: border-box; overflow-y: auto; z-index: 100;
        }
        .sb-brand {
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            font-size: 1.1rem; color: var(--ac); letter-spacing: 3px; margin-bottom: 3rem;
        }
        .sb-label {
            font-family: 'JetBrains Mono', monospace; font-size: .65rem;
            text-transform: uppercase; letter-spacing: 2px; color: var(--tx2);
            margin-bottom: 1.5rem; display: block;
        }
        
        .vcard {
            background: transparent; border: 1px solid var(--bd);
            padding: 1.2rem; position: relative; overflow: hidden;
            transition: all .4s cubic-bezier(.2,1,.3,1); cursor: pointer;
            margin-bottom: 0.8rem; border-radius: 4px;
        }
        .vcard::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--ac); transform: scaleY(0); transform-origin: top; transition: transform .4s;
        }
        .vcard:hover { border-color: rgba(255,59,48,.3); background: var(--sf); }
        .vcard.active { border-color: var(--ac); background: var(--sf); }
        .vcard.active::before, .vcard:hover::before { transform: scaleY(1); }
        
        .vcard-title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: var(--tx); }
        .vcard-desc { font-size: 0.75rem; color: var(--tx2); line-height: 1.3; }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            margin-left: 320px; flex: 1; padding: 4rem; min-height: 100vh;
            position: relative; z-index: 1;
        }
        .hero-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .hero-glow {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, var(--gw) 0%, transparent 70%);
            top: -10%; right: 10%; z-index: 0; filter: blur(80px); opacity: 0.5;
        }

        .header { margin-bottom: 4rem; position: relative; }
        .header h1 { font-size: 4rem; font-weight: 900; letter-spacing: -3px; line-height: 0.9; margin-bottom: 1rem; }
        .header h1 span { color: var(--ac); }
        
        .hero-stats {
            display: flex; gap: 40px; margin-top: 2rem; padding-top: 2rem;
            border-top: 1px solid var(--bd);
        }
        .sv { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: var(--ac); }
        .sl { font-size: .65rem; color: var(--tx2); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* ─── REGISTRY SECTION ─── */
        .registry-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
        }
        .search-box {
            background: var(--sf); border: 1px solid var(--bd);
            padding: 14px 24px; color: var(--tx); font-family: 'JetBrains Mono', monospace;
            font-size: .8rem; outline: none; transition: border .3s; width: 400px;
            border-radius: 2px;
        }
        .search-box:focus { border-color: var(--ac); }

        .repo-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .rcard {
            background: var(--sf); border: 1px solid var(--bd);
            padding: 2.5rem; position: relative; overflow: hidden;
            transition: all .5s cubic-bezier(.2,1,.3,1); cursor: pointer;
        }
        .rcard::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--ac), transparent);
            transform: scaleX(0); transform-origin: left; transition: transform .4s;
        }
        .rcard:hover { border-color: rgba(255,59,48,.2); background: var(--sf2); transform: translateY(-4px); }
        .rcard:hover::before { transform: scaleX(1); }
        
        .rcard-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .rcard-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.95rem; letter-spacing: -.5px; }
        .rcard-score { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--star); font-size: .85rem; }
        .rcard-tag {
            font-family: 'JetBrains Mono', monospace; font-size: .6rem;
            text-transform: uppercase; letter-spacing: 2px; color: var(--cy);
            margin-bottom: 14px; display: block;
        }
        .rcard-summary { font-size: .8rem; color: var(--tx2); line-height: 1.5; height: 3em; overflow: hidden; }

        /* ─── DETAIL PANE (RIGHT) ─── */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; z-index: 900; backdrop-filter: blur(8px); }
        #detailPane {
            position: fixed; right: -720px; top: 0; width: 700px; height: 100vh;
            background: var(--bg2); border-left: 1px solid var(--bd); z-index: 1000;
            transition: right .5s cubic-bezier(.2,1,.3,1); padding: 0;
            overflow-y: auto; box-shadow: -40px 0 100px rgba(0,0,0,0.8);
        }
        #detailPane.open { right: 0; }
        .detail-inner { padding: 60px; }
        .detail-close {
            position: absolute; top: 30px; right: 30px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-size: 1.8rem;
            color: var(--tx2); transition: color .3s; z-index: 10;
        }
        .detail-close:hover { color: var(--ac); }
        .detail-hero-bar {
            height: 4px; width: 100%;
            background: linear-gradient(90deg, var(--ac), var(--cy), transparent);
        }
        .detail-tag {
            font-family: 'JetBrains Mono', monospace; font-size: .65rem;
            text-transform: uppercase; letter-spacing: 2px; color: var(--ac);
            padding: 4px 12px; border: 1px solid rgba(255,59,48,.3);
            display: inline-block; margin-bottom: 16px;
        }
        .detail-name { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; line-height: 1.1; }
        .detail-score-val {
            font-family: 'JetBrains Mono', monospace; font-size: 1.2rem;
            font-weight: 700; color: var(--star); margin-bottom: 30px;
        }

        .detail-section { margin-top: 35px; padding-top: 35px; border-top: 1px solid var(--bd); }
        .detail-label {
            font-family: 'JetBrains Mono', monospace; font-size: .65rem;
            text-transform: uppercase; letter-spacing: 3px; color: var(--ac);
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .detail-label::before { content: ''; width: 20px; height: 1px; background: var(--ac); }
        .detail-text { font-size: 1.15rem; line-height: 1.8; color: var(--tx); font-weight: 300; }
        
        /* SPECIAL HIGHLIGHT FOR MAIN INFO */
        .info-block {
            background: rgba(59, 130, 246, 0.05); border-left: 2px solid var(--cy);
            padding: 2.5rem; margin-top: 10px; border-radius: 4px;
        }
        .info-block span { color: var(--cy); font-weight: 600; display: block; margin-top: 10px; }

        .tech-pill {
            font-family: 'JetBrains Mono', monospace; font-size: .7rem;
            padding: 6px 16px; background: var(--sf); border: 1px solid var(--bd);
            color: var(--tx); display: inline-block; margin: 0 8px 8px 0;
        }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp .6s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--sf2); border-radius: 10px; }

        /* ─── LANGUAGE SWITCHER ─── */
        .lang-switcher {
            display: flex; gap: 6px; margin-bottom: 2rem;
        }
        .lang-btn {
            background: rgba(255,255,255,.03); border: 1px solid var(--bd); 
            color: var(--tx2); padding: 5px 10px; font-family: 'JetBrains Mono', monospace;
            font-size: .65rem; cursor: pointer; transition: all .3s; border-radius: 2px;
        }
        .lang-btn:hover { color: var(--tx); border-color: var(--tx2); }
        .lang-btn.active { color: var(--ac); border-color: var(--ac); background: rgba(255,59,48,.08); }
        
    </style>
</head>

        let repos = REPO_DATA.sort((a,b) => b.score - a.score);
        let activeVector = 'all';

        const vectorMeta = {
            "AI / Cognitive": "🧠 Алгоритмическое сознание и LLM",
            "Data Intelligence": "⚡ Обработка и синтез сырых данных",
            "Security & Audit": "🛡️ Протоколы защиты и аудита кода",
            "OSINT / Recce": "👁️ Разведка и внешнее сканирование",
            "Systems / HW": "⚙️ Низкоуровневая архитектура и OS",
            "Robotics / UAV": "🤖 Физическое агентство и навигация",
            "Crypto & Privacy": "🔐 Суверенитет и шифрование данных",
            "Core / Other": "📦 Вспомогательные инфо-ресурсы"
        };

        function init() {
            renderVectors();
            renderRepos(repos);
            updateStats();
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = repos.length;
            const avg = (repos.reduce((s,r) => s + r.score, 0) / repos.length).toFixed(1);
            document.getElementById('statAvg').textContent = avg;
            document.getElementById('statTop').textContent = repos.filter(r => r.score >= 8).length;
        }

        function renderVectors() {
            const list = document.getElementById('vectorList');
            list.innerHTML = Object.entries(vectorMeta).map(([name, desc]) => `
                <div class="vcard" onclick="selectVector('${name}')" data-vector="${name}">
                    <div class="vcard-title">${name}</div>
                    <div class="vcard-desc">${desc}</div>
                </div>
            `).join('');
        }

        function renderRepos(list) {
            const grid = document.getElementById('repoGrid');
            grid.innerHTML = list.map((r, i) => `
                <div class="rcard fade-up" style="animation-delay:${Math.min(i*20, 500)}ms" onclick="openDetail('${r.name}')">
                    <div class="rcard-header">
                        <div class="rcard-name">${r.name}</div>
                        <div class="rcard-score">⭐ ${r.score}</div>
                    </div>
                    <span class="rcard-tag">${r.vector}</span>
                    <div class="rcard-summary">${getSummary(r).substring(0, 100)}${getSummary(r).length > 100 ? '...' : ''}</div>
                </div>
            `).join('');
        }

        function selectVector(v) {
            activeVector = v;
            document.querySelectorAll('.vcard').forEach(c => {
                c.classList.toggle('active', v === 'all' ? c.innerText.includes('ALL') : c.dataset.vector === v);
            });
            const filtered = v === 'all' ? repos : repos.filter(r => r.vector === v);
            renderRepos(filtered);
            document.getElementById('viewTitle').textContent = v === 'all' ? T[currentLang].global_archive : v;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchRepos() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = (activeVector === 'all' ? repos : repos.filter(r => r.vector === activeVector))
                .filter(r => r.name.toLowerCase().includes(val) || r.techs.join(' ').toLowerCase().includes(val));
            renderRepos(filtered);
        }

        function openDetail(name) {
            const r = repos.find(x => x.name === name);
            const content = document.getElementById('detailContent');
            const t = T[currentLang];

            // Pick translated fields, fallback to RU
            const summary = getSummary(r);
            const nexusUse = getNexusUse(r);
            const fullDescription = [summary, nexusUse].filter(Boolean).join(' ');

            content.innerHTML = `
                <span class="detail-tag">${r.domain} — ${r.vector}</span>
                <h2 class="detail-name">${r.name}</h2>
                <div class="detail-score-val">⭐ ${r.score} / 10 NEXUS ${t.score}</div>

                <div class="detail-section">
                    <div class="detail-label">${t.info}</div>
                    <div class="info-block">
                        <div class="detail-text">${fullDescription || '—'}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">${t.target}</div>
                    <div class="detail-text">${nexusUse || t.target_desc}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">${t.label_tech}</div>
                    <div>${(r.techs||[]).map(tech => `<span class="tech-pill">${tech}</span>`).join('') || '—'}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-label">GitHub</div>
                    <div class="detail-text">
                        <a href="https://github.com/search?q=${encodeURIComponent(r.name)}&type=repositories" 
                           target="_blank" style="color:var(--cy);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.8rem;">
                            ↗ Search on GitHub
                        </a>
                    </div>
                </div>
            `;
            document.getElementById('detailPane').classList.add('open');
            document.getElementById('overlay').style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('detailPane').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        document.getElementById('overlay').onclick = closeDetail;
        init();
    </script>
