version: '3.8'

services:
  # Postgres with pgvector extension for Local RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  # Upstash Redis local alternative
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data

  # Deep Graph Memory for NEXUS
  neo4j:
    image: neo4j:5-community
    container_name: nexus_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - nexus_neo4j_data:/data

  # Apache Airflow Orchestrator
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: nexus_airflow_web
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - LOAD_EX = n
      - EXECUTOR = CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN = postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL = redis://redis:6379/1
    ports:
      - "8081:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: nexus_airflow_scheduler
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - LOAD_EX = n
      - EXECUTOR = CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN = postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL = redis://redis:6379/1
    command: scheduler

  # FastAPI Backend Service (Placeholder for production deploy)
  # backend:
  #   build: ./backend
  #   container_name: nexus_api
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #     - redis
  #   env_file:
  #     - .env

volumes:
  nexus_pgdata:
  nexus_redis_data:
  nexus_neo4j_data:
  nexus_airflow_logs:
